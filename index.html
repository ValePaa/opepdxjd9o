<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<title>Scheda forza e corsa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ec; --card:#ffffff; --card2:#f7f6f2; --ink:#16171a; --muted:#5d6168; --faint:#8a8e95; --line:#e3e0d9;
  --accent:#1d6b57; --accent-ink:#ffffff; --accent-soft:#e1eee9;
  --run:#1d6b57; --run-soft:#e1eee9;
  --fa:#2456a6; --fa-soft:#e4ebf8;
  --fb:#a3521c; --fb-soft:#f8eadf;
  --fc:#6a4a9c; --fc-soft:#eee8f7;
  --ok:#1d6b57; --ok-soft:#e1eee9;
  --warn-soft:#fbf1d9; --warn-ink:#5c4708;
  --bad:#a12a3a; --bad-soft:#f8e3e6;
  --z1:#2f8f6f; --z2:#c49a1a; --z3:#d06a1f; --z4:#c0353f; --z5:#7a7f87;
  --shadow:0 1px 2px rgba(20,20,20,.04),0 4px 14px rgba(20,20,20,.05);
  --r:18px; --tabh:62px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111214; --card:#1a1c1f; --card2:#212428; --ink:#ecebe7; --muted:#a4a8ae; --faint:#7c8187; --line:#2c2f34;
    --accent:#5cc4a5; --accent-ink:#0d1f19; --accent-soft:#1a2f29;
    --run:#5cc4a5; --run-soft:#1a2f29;
    --fa:#8fb2ee; --fa-soft:#1c2738;
    --fb:#eba274; --fb-soft:#3a2619;
    --fc:#c3a6ec; --fc-soft:#2b2338;
    --ok:#5cc4a5; --ok-soft:#1a2f29;
    --warn-soft:#2f2a1a; --warn-ink:#f0d68c;
    --bad:#ee8a98; --bad-soft:#3a1f24;
    --z1:#5cc4a5; --z2:#e2c15a; --z3:#ef9a5a; --z4:#ee6f78; --z5:#9aa0a8;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 96px)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:"Inter Tight",Inter,-apple-system,sans-serif;letter-spacing:-.02em;margin:0}
h1{font-size:2rem;line-height:1.08;font-weight:800}
h2{font-size:1.35rem;line-height:1.2;font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:0 0 10px}
a{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:.88rem}
.eyebrow{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--muted)}
button{font:inherit;color:inherit}

/* testata delle viste */
.vhead{padding:22px 0 14px}
.vhead h1{margin:4px 0 6px}
.vhead p{color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.82rem;font-weight:600;color:var(--muted)}
.chip b{color:var(--ink)}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:14px}

.btn{font-weight:600;font-size:.95rem;border:0;border-radius:12px;padding:11px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn-acc{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn-link{background:none;color:var(--accent);padding:8px 4px;min-height:0}
.btn-wide{width:100%}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.note{font-size:.92rem;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn-ink);margin:10px 0}
.note input{font:inherit;font-size:16px;width:110px;padding:5px 8px;margin:4px 4px 0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.note.test{display:grid;gap:8px}
.note.test label{display:flex;justify-content:space-between;align-items:center;gap:10px}
.note.test input{margin:0;flex:0 0 110px}
.note.good{background:var(--ok-soft);color:var(--ok)}
.note.bad{background:var(--bad-soft);color:var(--bad)}

/* prontezza */
.ready{display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center}
.ready label.l{font-weight:650}
.ready label.l small{display:block;color:var(--muted);font-weight:500;font-size:.84rem}
.ready input.f{width:84px;text-align:center;font-weight:700}
.ready .sick{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
.ready .sick input{width:20px;height:20px;accent-color:var(--accent)}
.ready .out{grid-column:1/-1;margin:0}

/* seduta */
.sess{--c:var(--line);--cs:var(--card2);background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.sess.run{--c:var(--run);--cs:var(--run-soft)} .sess.fa{--c:var(--fa);--cs:var(--fa-soft)} .sess.fb{--c:var(--fb);--cs:var(--fb-soft)} .sess.fc{--c:var(--fc);--cs:var(--fc-soft)}
.shead{background:var(--cs);padding:16px 16px 14px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.skind{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--c)}
.stitle{font-size:1.45rem;margin-top:2px}
.smeta{color:var(--muted);font-size:.9rem;margin-top:2px}
.shead .prog{background:color-mix(in srgb,var(--c) 18%,transparent);margin-top:10px}
.shead .prog i{background:var(--c)}
.badge{flex:0 0 auto;font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:8px;background:var(--c);color:var(--card)}
.sbody{padding:4px 16px 16px}
.config{font-size:.92rem;padding:12px 0;border-bottom:1px solid var(--line)}
.config .warm{display:block;color:var(--muted);margin-top:4px}

.blk{margin:20px 0 0;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--faint)}
.ex{padding:14px 0 12px;border-bottom:1px solid var(--line)}
.extop{display:flex;gap:10px;align-items:flex-start}
.code{flex:0 0 auto;min-width:38px;height:30px;padding:0 6px;border-radius:9px;background:var(--cs);color:var(--c);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.86rem}
.exname{font-weight:700;font-size:1.06rem;line-height:1.3}
.exsub{color:var(--muted);font-size:.86rem;margin-top:1px}
.stats{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;gap:6px;margin:10px 0 0}
.stat{background:var(--card2);border-radius:12px;padding:7px 10px;min-width:0}
.stat small{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700}
.stat b{font-size:.98rem;font-weight:650;line-height:1.3;display:block;font-variant-numeric:tabular-nums}
.stat.big b{font-size:1.35rem;font-family:"Inter Tight",sans-serif;font-weight:800}
.prev{font-size:.86rem;color:var(--muted);margin-top:8px}
.prev b{color:var(--ink);font-weight:650}
.up{font-size:.88rem;margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--ok-soft);color:var(--ok)}

.sets{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);gap:6px 8px;margin-top:10px;align-items:center}
.sets .h{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700}
.chk{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);-webkit-tap-highlight-color:transparent}
.chk.on{background:var(--c);border-color:var(--c);color:var(--card)}
.chk.on span{display:none}
.chk.on::after{content:"✓";font-size:1.15rem}
input.f{font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--ink);width:100%;min-width:0;min-height:44px}
input.f:focus,.note input:focus{outline:2px solid var(--accent);outline-offset:1px}
details.how{margin-top:10px}
details.how summary{cursor:pointer;color:var(--accent);font-size:.9rem;font-weight:650;list-style:none;padding:4px 0}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"＋ "}
details.how[open] summary::before{content:"－ "}
details.how p{font-size:.93rem;color:var(--muted);margin:6px 0 0}
details.how p i{font-style:normal;font-weight:700;color:var(--ink)}

.targets{display:grid;gap:6px;margin:14px 0 4px}
.tg{display:grid;grid-template-columns:8px 1fr auto;gap:2px 10px;align-items:center;background:var(--card2);border-radius:12px;padding:9px 12px}
.tg i{grid-row:span 2;width:8px;height:30px;border-radius:4px}
.tg span{font-weight:650}
.tg b{font-family:"Inter Tight",sans-serif;font-size:1.15rem;font-variant-numeric:tabular-nums;grid-row:span 2}
.tg small{color:var(--muted);font-size:.8rem}
.steps{margin:6px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--cs);color:var(--c);font-weight:800;font-size:.85rem;display:flex;align-items:center;justify-content:center}
.steps .k{font-weight:700;display:block}
.runlog{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:6px}
.runlog label,.lbl{font-size:.7rem;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:3px}
.loghead{margin-top:16px;font-weight:700;font-size:.95rem}
.donebtn{margin-top:16px}
.donebtn.is{background:var(--ok-soft);color:var(--ok);border-color:transparent}
details.anyway>summary{cursor:pointer;color:var(--accent);font-weight:650;padding:6px 0 14px;list-style:none}

/* riposo e prossima seduta */
.rest{text-align:center;padding:26px 16px}
.rest .big{font-family:"Inter Tight",sans-serif;font-size:1.6rem;font-weight:800}
.nextup{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.nextup .tx{flex:1;min-width:0}
.nextup .tx small{display:block;color:var(--muted);font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.nextup .tx b{font-weight:700}
.nextup .arr{color:var(--faint);font-size:1.3rem}

/* settimana */
.wpick{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;margin:16px 0 4px}
.wpick button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 0 6px;cursor:pointer;line-height:1.15;position:relative}
.wpick button b{display:block;font-size:1rem;font-family:"Inter Tight",sans-serif}
.wpick button small{font-size:.66rem;color:var(--muted)}
.wpick button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wpick button.on small{color:inherit;opacity:.7}
.wpick button.now:not(.on){border-color:var(--accent);border-width:2px}
.wpick button .dots{display:flex;justify-content:center;gap:1px;margin-top:3px}
.wpick button .dots i{width:3px;height:3px;border-radius:50%;background:var(--line)}
.wpick button .dots i.y{background:var(--accent)}
.wpick button.on .dots i{background:color-mix(in srgb,var(--bg) 35%,transparent)}
.wpick button.on .dots i.y{background:var(--bg)}
.wmeta{margin:14px 0 12px}
.wmeta p{color:var(--muted);font-size:.92rem;margin:6px 0 0}
.drow{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.drow.today{border:2px solid var(--accent)}
.drow.restd{background:transparent;box-shadow:none;border-style:dashed;cursor:default;color:var(--muted)}
.dnum{width:48px;height:48px;border-radius:13px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-weight:700}
.dnum small{font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;color:var(--muted)}
.dnum span{font-size:1.15rem;font-family:"Inter Tight",sans-serif}
.dl{display:block;line-height:1.3}
.dl+.dl{margin-top:4px}
.dl i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.dl b{font-weight:650}
.dl small{color:var(--muted);font-size:.82rem}
.dst{font-size:.82rem;color:var(--muted);text-align:right;white-space:nowrap;line-height:1.5}
.dst .ok{color:var(--ok);font-weight:700}
.dst .td{color:var(--accent);font-weight:800;text-transform:uppercase;font-size:.72rem;letter-spacing:.08em}

/* ritmi */
.calc{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.calc input.f{width:120px}
.zones{display:grid;gap:8px;margin:14px 0}
.zone{display:grid;grid-template-columns:10px 1fr auto;gap:2px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.zone .bar{grid-row:span 2;width:10px;height:40px;border-radius:5px}
.zone b{font-weight:700}
.zone small{color:var(--muted);font-size:.84rem}
.zone .p{grid-row:span 2;text-align:right;font-family:"Inter Tight",sans-serif;font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums;line-height:1.1}
.zone .p small{display:block;font-family:Inter,sans-serif;font-weight:500;font-size:.76rem}

/* guida */
details.g{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:10px}
details.g>summary{list-style:none;cursor:pointer;padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
details.g>summary::-webkit-details-marker{display:none}
details.g>summary small{display:block;color:var(--muted);font-size:.86rem;font-weight:500;margin-top:2px}
details.g>summary::after{content:"⌄";color:var(--faint);font-size:1.2rem;transition:transform .2s}
details.g[open]>summary::after{transform:rotate(180deg)}
.gb{padding:0 16px 16px}
.gb p{color:var(--muted);font-size:.94rem}
ul.facts{margin:0;padding:0;list-style:none}
ul.facts li{padding:11px 0;border-top:1px solid var(--line);color:var(--muted);font-size:.94rem}
ul.facts li:first-child{border-top:0}
ul.facts b{color:var(--ink)}
.kpis{display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:10px}
.kpi{background:var(--card2);border-radius:14px;padding:12px}
.kpi .l{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700}
.kpi .v{font-family:"Inter Tight",sans-serif;font-weight:800;font-size:1.4rem;line-height:1.15;margin-top:2px}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:.7rem;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
td i.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

/* timer di recupero */
.timer{position:fixed;left:12px;right:12px;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 10px);max-width:696px;margin:0 auto;z-index:40;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 10px 10px 16px;display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.timer[hidden]{display:none}
.timer small{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;opacity:.7;font-weight:700}
.timer b{font-family:"Inter Tight",sans-serif;font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1}
.timer .tn{font-size:.86rem;opacity:.85;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer button{border:0;border-radius:10px;padding:10px 12px;font-weight:700;font-size:.85rem;cursor:pointer;background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg)}
.timer.go{background:var(--accent);color:var(--accent-ink)}
.timer.go button{color:var(--accent-ink);background:color-mix(in srgb,var(--accent-ink) 14%,transparent)}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-200%);visibility:hidden;transition:transform .25s,visibility .25s;z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.92rem;max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0);visibility:visible}

/* barra in basso */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tabs button{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;font-weight:650;color:var(--faint);-webkit-tap-highlight-color:transparent}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--accent)}

@media (max-width:420px){
  h1{font-size:1.75rem}
  .kpis{grid-template-columns:1fr}
}
@media print{
  .tabs,.timer,.toast{display:none!important}
  body{padding:0;background:#fff}
}
</style>
</head>
<body>
<main class="wrap" id="view"></main>

<div class="timer" id="timer" hidden>
  <div><small id="tlab">Recupero</small><b id="tclock">0:00</b></div>
  <div class="tn" id="tnext"></div>
  <button id="tplus">+15 s</button>
  <button id="tstop">Salta</button>
</div>
<div class="toast" id="toast"></div>

<nav class="tabs"><div class="in">
  <button data-tab="oggi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Oggi</button>
  <button data-tab="sett"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Settimana</button>
  <button data-tab="ritmi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-6"/></svg>Ritmi</button>
  <button data-tab="guida"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7"/></svg>Guida</button>
</div></nav>

<script>
// ---------- salvataggio locale ----------
const KEY='scheda-fc-2026';
let store={};
try{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){store={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}

// ---------- ritmi (formule VDOT di Daniels) ----------
const vo2=v=>-4.60+0.182258*v+0.000104*v*v;
const pct=t=>0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t);
const vAt=o=>(-0.182258+Math.sqrt(0.182258**2+4*0.000104*(o+4.60)))/(2*0.000104);
const VDOT_PROVV=36.5; // stima da 10 km a 5:42 con FC 167 (27/10) e 5,2 km a 5:13 (16/04)
const vdot=()=>store.vdot||VDOT_PROVV;
function pace(f){const s=Math.round(60000/vAt(f*vdot()));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
const Z={
  E:{n:'Facile',z:'Z2',fc:'135–150',p:()=>pace(.74)+'–'+pace(.65),d:'parli a frasi intere',c:'var(--z1)'},
  M:{n:'Medio',z:'Z3',fc:'151–165',p:()=>pace(.80),d:'solo nel finale di alcuni lunghi',c:'var(--z2)'},
  T:{n:'Soglia',z:'Z4',fc:'166–176',p:()=>pace(.88),d:'duro ma controllato, lo terresti un’ora',c:'var(--z3)'},
  I:{n:'Ripetute',z:'Z5',fc:'≥177 a fine ripetuta',p:()=>pace(.975),d:'lo terresti 10–12 minuti',c:'var(--z4)'},
  R:{n:'Allunghi',z:'',fc:'—',p:()=>pace(1.05),d:'veloce e sciolto, mai sprint',c:'var(--z5)'}
};
const zp=k=>`<b>${Z[k].p()}/km</b> · FC ${Z[k].fc}`;
function parseT(s){const m=String(s||'').trim().match(/^(\d{1,2})[:.,](\d{2})$/);if(!m)return null;const t=+m[1]+(+m[2])/60;return (t>=13&&t<=50)?t:null}
function setVdotFrom(str){const t=parseT(str);if(!t)return false;store.vdot=vo2(5000/t)/pct(t);store.t5k=String(str).trim();save();return true}
// il test registrato nella corsa aggiorna i ritmi anche se non l'hai ricopiato in «Ritmi»
if(!store.vdot){const s=parseT(store.t5k8)?store.t5k8:store.t5k1;if(parseT(s))setVdotFrom(s)}

function prevLog(e,k,w){
  for(let pw=w-1;pw>=0;pw--){
    const reps=[],kgs=[];
    for(let i=1;i<=8;i++){const b=setKey(pw,k,e.id,i);if(store[b+'.r'])reps.push(store[b+'.r']);if(store[b+'.kg'])kgs.push(store[b+'.kg'])}
    if(reps.length||kgs.length)return {w:pw,reps,kgs};
  }
  return null;
}
function closedRange(e,p){
  if(!p||!p.reps.length)return false;
  const r=p.w<4?e.r1:e.r2, m=r.match(/(\d+)\s*–\s*(\d+)/);
  if(!m)return false;
  const top=+m[2], vals=p.reps.map(x=>parseInt(x,10));
  return vals.length>=e.s[p.w]&&vals.every(v=>!isNaN(v)&&v>=top);
}

   ${notes}${prev}<div class="sets">${rows}</div>
   <details class="how"><summary>Come si fa</summary><p>${how}</p></details></div>`;
}
function strProgress(w,k){
  const low=lowFor(w,k);let tot=0,done=0;
  SMETA[k].list.forEach(e=>{if(e.blk)return;const s=setsOf(e,w,low);tot+=s;for(let i=1;i<=s;i++)if(store[setKey(w,k,e.id,i)+'.ok'])done++});
  return {tot,done};
}
function strBody(w,k,lvl){
  const m=SMETA[k], low=lvl>=1, test=(w===0||w===7), n=w?8:1;
  let h=`<div class="config">${m.cfg}<span class="warm">${m.warm}</span></div>`;
  if(low)h+=`<div class="note bad">Prontezza bassa: una serie in meno per esercizio e una ripetizione di margine in più (RIR +1). È già applicato qui sotto.</div>`;
  if(test&&k==='A')h+=`<div class="note test"><b>Test di oggi</b><label>Trazioni massime a corpo libero ${inpN('tpull'+n,'ripetizioni')}</label><label>Goblet squat con un 25, massime ripetizioni ${inpN('tgsq'+n,'ripetizioni')}</label></div>`;
  // il goblet squat è entrato a settimana 1 già iniziata: il test si può fare anche in settimana 2
  if(w===1&&k==='A')h+=`<div class="note test"><b>Test del goblet squat</b> · solo se non l'hai fatto in settimana 1: serie 1 = massime ripetizioni pulite, poi le altre a RIR 2.<label>Goblet squat con un 25, massime ripetizioni ${inpN('tgsq1','ripetizioni')}</label></div>`;
  if(test&&k==='B')h+=`<div class="note test"><b>Test nel riscaldamento</b><label>Salto in lungo da fermo, il migliore di 3 ${inpN('tjump'+n,'cm')}</label></div>`;
  return h+m.list.map(e=>exHTML(e,w,k,low)).join('');
}

// ---------- corsa ----------
function runBody(w,k,lvl){
  const r=RUN[w][k], all=r.st.map(x=>x.join(' ')).join(' ');
  const zs=['E'];
  ['I','T','M'].forEach(z=>{if(all.includes('ritmo '+z))zs.push(z)});
  if(/allungh/i.test(all))zs.push('R');
  const targets=`<div class="targets">${zs.map(z=>`<div class="tg"><i style="background:${Z[z].c}"></i><span>${Z[z].n}${z==='E'?' · comanda la FC':z==='R'?'':' · comanda il ritmo'}</span><b>${Z[z].p()}</b><small>${z==='R'?Z[z].d:'FC '+Z[z].fc}</small></div>`).join('')}</div>`;
  const steps=`<ul class="steps">${r.st.map(([a,b])=>`<li><div><span class="k">${a}</span>${b
    .replace('ritmo I',`ritmo I (${zp('I')})`).replace('ritmo T',`ritmo T (${zp('T')})`).replace('ritmo M',`ritmo M (<b>${Z.M.p()}/km</b>)`)
    .replace(/in zona facile/,`in zona facile (${zp('E')})`)}</div></li>`).join('')}</ul>`;
  let main;
  if(lvl>=1&&k==='q'){
    main=`<div class="note bad">Prontezza bassa: oggi la qualità diventa <b>30' facili</b> (${zp('E')}).</div><details class="how"><summary>La seduta originale</summary>${steps}</details>`;
  }else main=targets+steps;
  const cap=r.cap?`<div class="note">Tetto: <b>${num(r.cap)} km</b>. Se ci arrivi prima del tempo, ti fermi: conta più della durata.</div>`:'';
  const test=r.test?`<div class="note">Test: scrivi il tempo dei 5 km qui sotto. I ritmi di tutta la scheda si aggiornano da soli.</div>`:'';
  const b=`w${w+1}.${k}`;
  return `${main}${cap}${test}<div class="loghead">Com'è andata</div><div class="runlog">
   <div><label>km</label>${inp(b+'.km','km','decimal')}</div><div><label>${r.test?'Tempo sui 5 km':'Tempo'}</label>${inp(r.test?r.test:b+'.t','mm:ss','numeric')}</div>
   <div><label>FC media</label>${inp(b+'.fc','bpm','numeric')}</div><div><label>Note</label>${inp(b+'.n','sensazioni')}</div></div>`;
}

// ---------- una seduta ----------
function sessionHTML(w,k,lvl){
  const si=sessInfo(w,k), done=isDone(w,k);
  let meta=si.dur, bar='';
  if(si.type==='str'){const p=strProgress(w,k);meta+=` · <span data-prog="${w}|${k}">${p.done}/${p.tot} serie</span>`;bar=`<div class="prog"><i data-bar="${w}|${k}" style="width:${p.tot?p.done/p.tot*100:0}%"></i></div>`}
  const body=si.type==='str'?strBody(w,k,lvl):runBody(w,k,lvl);
  return `<section class="sess ${si.cls}"><div class="shead"><div style="flex:1;min-width:0"><div class="skind">${si.kind}</div><h2 class="stitle">${si.title}</h2><div class="smeta">${meta}</div>${bar}</div>${done?'<span class="badge">Fatta</span>':''}</div>
   <div class="sbody">${body}<button class="btn btn-ghost btn-wide donebtn ${done?'is':''}" data-done="${w}|${k}">${done?'✓ Seduta fatta · tocca per annullare':'Segna la seduta come fatta'}</button></div></section>`;
}

// ---------- viste ----------
let S={tab:'oggi',w:0,day:null};
function nextSession(w,d){
  let x=w*7+d+1;

  return null;
}
function dayTitle(w,d){return PLAN[d].map(k=>sessInfo(w,k).short).join(' + ')}
function nextCard(w,d,label){

  const when=diff===1?'Domani':`${GGL[n.d]} ${x.getDate()}`;
  return `<button class="nextup" data-day="${n.w}|${n.d}"><span class="tx"><small>${label||'Prossima seduta'} · ${when}</small><b>${dayTitle(n.w,n.d)}</b></span><span class="arr">›</span></button>`;
}
function hasData(){return Object.keys(store).some(k=>/^(w\d|t)/.test(k)&&store[k])}
function exportReminder(){

  if(last!==null&&last<14)return '';
  return `<div class="card"><b>Fai una copia del diario</b><p class="small muted" style="margin:4px 0 10px">I dati stanno solo in questo browser. ${last===null?'Non hai mai esportato.':`Ultima copia ${last} giorni fa.`}</p><button class="btn btn-ghost" data-exp>Esporta il diario</button></div>`;
}
function readyCard(iso){

    :'<div class="out note good">Via libera: seduta come da programma.</div>';

function dayContent(w,d,isToday){
  const iso=isoOf(dataDi(w,d)), ks=PLAN[d], lvl=readyLevel(iso);

    return `<div class="card rest"><div class="big">Riposo</div><p class="muted" style="margin:6px 0 0">Il recupero è parte dell'allenamento. Se vuoi muoverti, una camminata.</p></div>`+nextCard(w,d);
  }

  if(lvl===2)h+=`<details class="anyway"><summary>Mostra comunque la seduta</summary>${sess}</details>`;

}
function viewToday(){

    <div class="prog"><i style="width:${(t.raw+1)/56*100}%"></i></div></header>`+dayContent(t.w,t.d,true)+exportReminder();

function viewDay(w,d){

function viewZones(){

    <button class="btn btn-acc" data-calc>Ricalcola i ritmi</button></div><p class="small muted" id="vdotout" style="margin:8px 0 0">Il tempo del test registrato nella corsa li aggiorna da solo.</p></div>
   <div class="zones">${Object.values(Z).map(z=>`<div class="zone"><span class="bar" style="background:${z.c}"></span><b>${z.n}${z.z?' · '+z.z:''}</b><span class="p">${z.p()}<small>/km</small></span><small>FC ${z.fc} · ${z.d}</small></div>`).join('')}</div>

}

  g('Prima e dopo','I test di settimana 1 e 8',testsTable())+
  g('Le evidenze dietro le scelte','Perché la scheda è fatta così',`<ul class="facts">
    <li><b>Forza pesante e salti migliorano l'economia di corsa</b>; i carichi submassimali e gli isometrici molto meno. Per questo i salti ci sono ogni settimana: con i manubri a 25 kg gli esercizi per le gambe non sono carichi pesanti, e il loro compito è la massa muscolare, portata vicino al cedimento. <a href="https://repositorio.unab.cl/handle/ria/62074">Llanos-Lagos et al., Sports Medicine 2024</a></li>
    <li><b>Forza e corsa insieme</b> non frenano né la crescita muscolare né la forza massima; frenano un po' l'esplosività, soprattutto nella stessa seduta. Per questo i salti stanno il sabato, dopo un giorno di riposo e lontano dalle corse. <a href="https://researchonline.jcu.edu.au/71546/1/Schumann2021_Article_CompatibilityOfConcurrentAerob.pdf">Schumann et al., Sports Medicine 2022</a></li>
    <li><b>Vicino al cedimento</b> la crescita muscolare aumenta, la forza molto meno. <a href="https://rke.abertay.ac.uk/en/publications/exploring-the-dose-response-relationship-between-estimated-resist/">Robinson et al., Sports Medicine 2024</a>. Con carichi leggeri vicino al cedimento si cresce quanto con quelli pesanti, mentre la forza massima segue il carico (Schoenfeld et al., J Strength Cond Res 2017): da qui i 25 kg fissi più lo zaino che sale.</li>
    <li><b>Più serie, rendimenti decrescenti</b>, e per la forza calano prima: bastano ~10 serie settimanali per muscolo. <a href="https://bibbase.org/network/publication/joshuapelland-jacobremmert-zacrobinson-sethhinson-michaelzourdos-theresistancetrainingdoseresponsemetaregressionsexploringtheeectsofweeklyvolumeandfrequencyonmusclehypertrophyandstrengthgain-2024">Pelland et al., 2024</a> (preprint)</li>
    <li><b>Recuperi</b>: oltre 60 s la crescita è un po' maggiore, oltre 90 s non cambia più. <a href="https://www.frontiersin.org/journals/sports-and-active-living/articles/10.3389/fspor.2024.1429789/abstract">Singer et al., Frontiers 2024</a></li>
    <li><b>Esercizi in coppia</b>: sedute più brevi, stessi risultati di forza e massa. <a href="https://eprints.leedsbeckett.ac.uk/id/eprint/11908">Zhang et al., Sports Medicine 2025</a></li>
    <li><b>Distribuzione dell'intensità</b>: il polarizzato dà un piccolo vantaggio sul VO2max nei blocchi brevi; per i dilettanti il piramidale va altrettanto bene. La scheda è piramidale. <a href="https://link.springer.com/content/pdf/10.1007/s40279-024-02034-z.pdf">Oliveira et al., Sports Medicine 2024</a>; Rosenblat et al., Sports Medicine 2025</li>
    <li><b>Ripetute</b>: 4 × 4' alla massima intensità sostenibile alzano il VO2max più della corsa continua (Helgerud et al., Med Sci Sports Exerc 2007); nei dilettanti allenati 4 × 8' rendono più di 4 × 4' (Seiler et al., Scand J Med Sci Sports 2013).</li>
    <li><b>Il lungo cresce poco</b>: il rischio di infortunio sale quando un'uscita supera di oltre il 10% la più lunga degli ultimi 30 giorni. Da qui il tetto in km di ogni lungo. <a href="https://researchportal.lih.lu/en/publications/how-much-running-is-too-much-identifying-high-risk-running-sessio/">Frandsen et al., British Journal of Sports Medicine 2025</a></li>
    <li><b>Seguire la HRV</b> dà un piccolo vantaggio sul VO2max, maggiore nei dilettanti. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7663087/">Granero-Gallegos et al., IJERPH 2020</a></li>
    <li><b>Ritmi</b>: formule VDOT di Jack Daniels. <b>Proteine</b>: Morton et al., BJSM 2018. <b>Sonno</b>: Craven et al., Sports Medicine 2022.</li></ul>`)+
  g('Il diario','Ultima copia: '+last,`<p>Quello che scrivi nei campi è salvato solo in questo browser, su questo dispositivo: non va su internet. Esporta ogni tanto una copia; con «Importa» la porti su un altro dispositivo.</p>
   <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"><button class="btn btn-ghost" data-exp>Esporta il diario</button>
   <label class="btn btn-ghost">Importa un diario<input type="file" data-imp accept="application/json" hidden></label></div>`)+
  `<p class="small muted" style="margin:20px 0">Scheda costruita sui dati di Forma e sui carichi della scheda precedente. Non sostituisce un parere medico.</p>`;
}

// ---------- disegno ----------
let renderedDay='';
function render(keepScroll){
  const y=window.scrollY;
  let h;
  if(S.tab==='oggi')h=viewToday();
  else if(S.tab==='sett')h=S.day?viewDay(S.day[0],S.day[1]):viewWeek(S.w);
  else if(S.tab==='ritmi')h=viewZones();
  else h=viewGuide();
  $('#view').innerHTML=h;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  renderedDay=isoOf(new Date());
  window.scrollTo(0,keepScroll?y:0);
}
function go(tab){S.tab=tab;if(tab==='sett')S.day=null;render(false)}

// ---------- feedback ----------
let toastId=0;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastId);toastId=setTimeout(()=>el.classList.remove('on'),2600)}
let actx=null;
function unlockAudio(){try{if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC()}if(actx&&actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){try{if(!actx)return;[0,.25,.5].forEach(o=>{const os=actx.createOscillator(),gn=actx.createGain();os.frequency.value=880;gn.gain.setValueAtTime(.0001,actx.currentTime+o);gn.gain.exponentialRampToValueAtTime(.3,actx.currentTime+o+.02);gn.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+o+.18);os.connect(gn).connect(actx.destination);os.start(actx.currentTime+o);os.stop(actx.currentTime+o+.2)})}catch(e){}}
let wl=null;
async function keepAwake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}

// ---------- timer di recupero ----------
const T={end:0,next:'',id:0,fired:false};
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function startRest(sec,next){T.end=Date.now()+sec*1000;T.next=next;T.fired=false;$('#timer').hidden=false;clearInterval(T.id);T.id=setInterval(tick,250);tick()}
function stopRest(){clearInterval(T.id);$('#timer').hidden=true;$('#timer').classList.remove('go')}
function tick(){
  const left=Math.ceil((T.end-Date.now())/1000), el=$('#timer');
  if(left>0){el.classList.remove('go');$('#tlab').textContent='Recupero';$('#tclock').textContent=mmss(left);$('#tnext').textContent=T.next?'Poi: '+T.next:'';$('#tstop').textContent='Salta';$('#tplus').hidden=false}
  else{
    if(!T.fired){T.fired=true;beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
    el.classList.add('go');$('#tlab').textContent='Recupero finito';$('#tclock').textContent='Vai';$('#tnext').textContent=T.next||'';$('#tstop').textContent='OK';$('#tplus').hidden=true;
    if(Date.now()-T.end>20000)stopRest();
  }
}
$('#tplus').onclick=()=>{T.end+=15000;tick()};
$('#tstop').onclick=stopRest;

// cosa viene dopo una serie: la coppia indicata nel recupero, poi la stessa, poi il primo esercizio ancora da finire
function nextUp(w,k,e){
  const low=lowFor(w,k), list=SMETA[k].list.filter(x=>!x.blk);
  const firstOpen=x=>{for(let i=1;i<=setsOf(x,w,low);i++)if(!store[setKey(w,k,x.id,i)+'.ok'])return i;return 0};
  const lab=x=>`${x.c} · ${x.n}, serie ${firstOpen(x)}`;
  const m=e.rec.match(/poi ([A-Z]\d)/), tgt=m&&list.find(x=>x.c===m[1]);
  if(tgt&&firstOpen(tgt))return lab(tgt);
  if(firstOpen(e))return lab(e);
  const o=list.find(x=>firstOpen(x));
  return o?lab(o):null;
}
function refreshProgress(w,k){
  const p=strProgress(w,k), id=`${w}|${k}`;
  document.querySelectorAll(`[data-prog="${id}"]`).forEach(el=>el.textContent=`${p.done}/${p.tot} serie`);
  document.querySelectorAll(`[data-bar="${id}"]`).forEach(el=>el.style.width=(p.tot?p.done/p.tot*100:0)+'%');
  return p;
}
function exportDiary(){
  store.lastExport=new Date().toISOString();save();
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(store,null,1)],{type:'application/json'}));
  a.download='diario-scheda-'+isoOf(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();
  toast('Diario esportato');if(S.tab==='oggi'||S.tab==='guida')render(true);
}

// ---------- eventi ----------
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-tab],[data-w],[data-day],[data-back],[data-ok],[data-done],[data-calc],[data-exp]');
  if(!el)return;
  const ds=el.dataset;
  if(ds.tab){go(ds.tab);return}
  if(ds.w!==undefined){S.w=+ds.w;render(true);return}
  if(ds.day){const [w,d]=ds.day.split('|').map(Number);S.tab='sett';S.w=w;S.day=[w,d];render(false);return}
  if(ds.back!==undefined){S.day=null;render(false);return}
  if(ds.exp!==undefined){exportDiary();return}
  if(ds.calc!==undefined){const v=$('#t5k').value;if(setVdotFrom(v)){render(true);toast(`Ritmi aggiornati · VDOT ${num(store.vdot.toFixed(1))}`)}else $('#vdotout').textContent='Scrivi il tempo come 26:30';return}
  if(ds.done){const [w,k]=ds.done.split('|');const key=doneKey(+w,k);
    if(store[key])delete store[key];else{store[key]=new Date().toISOString();toast('Seduta segnata come fatta')}
    save();render(true);return}
  if(ds.ok){
    const [ws,k,id,is]=ds.ok.split('|'), w=+ws, i=+is, key=setKey(w,k,id,i), e=SMETA[k].list.find(x=>x.id===id);
    const on=!store[key+'.ok'];
    if(on){store[key+'.ok']=1;
      // lo zaino non cambia tra una serie e l'altra: se non l'hai scritto, si ripete quello della serie prima
      if(e.t==='zaino'&&!store[key+'.kg']&&i>1){const pk=store[setKey(w,k,id,i-1)+'.kg'];if(pk){store[key+'.kg']=pk;const f=document.querySelector(`input[data-k="${key}.kg"]`);if(f)f.value=pk}}
    }else delete store[key+'.ok'];
    el.classList.toggle('on',on);
    const p=refreshProgress(w,k);
    if(on){unlockAudio();keepAwake();
      if(p.done===p.tot){stopRest();if(!isDone(w,k)){store[doneKey(w,k)]=new Date().toISOString()}save();toast('Seduta completata ✓');render(true);return}
      save();
      const sec=+(e.rec.match(/^(\d+)\s*s/)||[])[1];
      if(sec)startRest(sec,nextUp(w,k,e));
    }else save();
  }
});
document.addEventListener('input',ev=>{const i=ev.target;if(i.dataset&&i.dataset.k){store[i.dataset.k]=i.value;save()}});
document.addEventListener('change',ev=>{
  const i=ev.target, ds=i.dataset||{};
  if(ds.k==='t5k1'||ds.k==='t5k8'){if(setVdotFrom(i.value)){toast(`Ritmi aggiornati dal test · VDOT ${num(store.vdot.toFixed(1))}`);render(true)}return}
  if(ds.ready!==undefined){store['ready.'+ds.ready]=i.value.trim();save();render(true);return}
  if(ds.sick!==undefined){if(i.checked)store['sick.'+ds.sick]=1;else delete store['sick.'+ds.sick];save();render(true);return}
  if(ds.imp!==undefined){const f=i.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o||typeof o!=='object')throw 0;store=o;save();render(true);toast('Diario importato')}catch(x){toast('File non valido')}})}
});
// se riapri la pagina in un altro giorno, «Oggi» si aggiorna da solo
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&renderedDay!==isoOf(new Date())&&S.tab==='oggi')render(false)});

// all'apertura: sempre la seduta di oggi
{const t=oggi();S.w=(t.w>=0&&t.w<8)?t.w:(t.w>7?7:0)}
render(false);
</script>
