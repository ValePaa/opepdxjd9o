<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Allenamento</title>
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --fill:#eeeef3; --fill2:#e4e4ea;
  --ink:#0b0b0f; --muted:#6c6c73; --faint:#a3a3aa; --line:rgba(60,60,67,.13);
  --accent:#2f6df6; --accentfill:rgba(47,109,246,.11);
  --ok:#1c9a5c; --okfill:rgba(28,154,92,.12);
  --warn:#b86e00; --warnfill:rgba(255,159,10,.15);
  --bad:#c93434; --badfill:rgba(255,69,58,.12);
  --run:#1c9a5c; --A:#2f6df6; --B:#ee7d1c; --C:#8a57ee;
  --z1:#2f9f74; --z2:#c99a14; --z3:#d9681c; --z4:#d23a44; --z5:#80858d;
  --r:20px; --tabbg:rgba(242,242,247,.86);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1c1c1e; --fill:#2c2c2e; --fill2:#3a3a3c;
    --ink:#f5f5f7; --muted:#98989f; --faint:#66666c; --line:rgba(84,84,88,.55);
    --accent:#5b8cff; --accentfill:rgba(91,140,255,.16);
    --ok:#32c27a; --okfill:rgba(50,194,122,.16);
    --warn:#ffb340; --warnfill:rgba(255,159,10,.18);
    --bad:#ff6b63; --badfill:rgba(255,69,58,.18);
    --run:#32c27a; --A:#5b8cff; --B:#ff9a45; --C:#a27bff;
    --z1:#4cc896; --z2:#e6bf45; --z3:#f08b48; --z4:#f2646c; --z5:#9aa0a8;
    --tabbg:rgba(18,18,20,.84);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 120px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
b{font-weight:650}
.num{font-variant-numeric:tabular-nums}
svg{display:block}

/* intestazione */
.hd{margin:6px 0 20px}
.hdrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eb{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
h1{font-size:34px;line-height:1.08;letter-spacing:-.028em;margin:4px 0 0;font-weight:760}
.sub{color:var(--muted);margin:6px 0 0;font-size:15px}
.bar{height:4px;border-radius:4px;background:var(--fill2);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .35s ease}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-size:16px;font-weight:500;margin:0 0 6px -6px;padding:6px}
.back svg{width:22px;height:22px}
.navs{display:flex;gap:8px;flex:none}
.rb{width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--ink)}
.rb svg{width:20px;height:20px}
.rb:disabled{opacity:.35}

/* contenitori */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:0 0 12px}
.sec{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:28px 4px 10px}
.foot{font-size:13.5px;color:var(--muted);margin:14px 4px}
.note{border-radius:16px;padding:13px 15px;font-size:14.5px;margin:0 0 12px;background:var(--card)}
.note.warn{background:var(--warnfill)} .note.bad{background:var(--badfill)} .note.good{background:var(--okfill)} .note.info{background:var(--accentfill)}
details.note summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
details.note summary::after{content:"+";color:var(--faint);font-weight:600}
details.note[open] summary::after{content:"–"}
details.note p{margin:8px 0 0;color:var(--muted)}
details summary::-webkit-details-marker{display:none}

/* esercizio */
.pair{font-size:12.5px;font-weight:600;color:var(--muted);margin:22px 4px 8px;display:flex;gap:10px;align-items:center;text-transform:uppercase;letter-spacing:.05em}
.pair::after{content:"";flex:1;height:1px;background:var(--line)}
.ex{background:var(--card);border-radius:var(--r);padding:16px 16px 0;margin:0 0 10px}
.exh{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.ex h3{margin:0;font-size:18px;line-height:1.25;letter-spacing:-.012em;font-weight:660}
.load{margin:3px 0 0;color:var(--muted);font-size:14.5px}
.tag{flex:none;font-size:12px;font-weight:650;padding:4px 10px;border-radius:99px;background:var(--fill);color:var(--muted);white-space:nowrap;margin-top:1px}
.tag.up{background:var(--okfill);color:var(--ok)} .tag.dl{background:var(--warnfill);color:var(--warn)} .tag.new{background:var(--accentfill);color:var(--accent)}
.goal{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:14px 0 0}
.goal b{font-size:24px;font-weight:720;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.goal small{color:var(--muted);font-size:13.5px}
.why{font-size:13.5px;color:var(--muted);margin:4px 0 0}
.sets{display:grid;grid-template-columns:24px 1fr 1fr 48px;gap:8px 10px;align-items:center;margin:16px 0 6px}
.sets.nokg{grid-template-columns:24px 1fr 48px}
.sets .h{font-size:11px;color:var(--faint);font-weight:650;text-transform:uppercase;letter-spacing:.06em;text-align:center}
.sets .n{color:var(--muted);font-weight:650;text-align:center;font-variant-numeric:tabular-nums}
.f{width:100%;height:44px;border:0;border-radius:12px;background:var(--fill);text-align:center;font-size:17px;font-weight:620;font-variant-numeric:tabular-nums;outline:none;-webkit-appearance:none;appearance:none;padding:0 8px}
.f::placeholder{color:var(--faint);font-weight:500}
.f:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.f.l{text-align:left;padding:0 14px;font-size:16px;font-weight:450}
.ck{width:48px;height:44px;border-radius:12px;background:var(--fill);display:grid;place-items:center;color:var(--faint);transition:background .15s,color .15s}
.ck svg{width:22px;height:22px}
.ck.on{background:var(--ok);color:#fff}
.rir{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 4px;font-size:13.5px;color:var(--muted)}
.rir span{line-height:1.25}
.rir.stack{flex-direction:column;align-items:stretch;gap:8px}
.rir.stack .seg button{flex:1;min-width:0}
.seg{display:flex;background:var(--fill);border-radius:11px;padding:2px;flex:none}
.seg button{min-width:40px;height:32px;padding:0 8px;border-radius:9px;font-size:14px;font-weight:620;color:var(--muted);text-align:center}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
@media (prefers-color-scheme: dark){.seg button.on{background:var(--fill2)}}
details.how{border-top:1px solid var(--line);margin:12px -16px 0;padding:0 16px}
details.how summary{list-style:none;padding:13px 0;font-size:14.5px;color:var(--accent);font-weight:550;cursor:pointer}
details.how p{margin:0 0 14px;font-size:14.5px;color:var(--muted)}
.ex.complete h3::after{content:" ✓";color:var(--ok)}

/* bottoni */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:650;font-size:16.5px;margin:18px 0 8px;text-align:center}
.btn svg{width:20px;height:20px;flex:none}
.btn.done{background:var(--okfill);color:var(--ok);font-size:15.5px}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.sm{display:inline-flex;height:42px;width:auto;padding:0 18px;border-radius:12px;font-size:15px;margin:0}

/* liste */
.list{background:var(--card);border-radius:var(--r);overflow:hidden;margin:0 0 12px}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;border-top:1px solid var(--line);min-height:62px}
.row:first-child{border-top:0}
.dt{width:38px;flex:none;text-align:center;line-height:1.1}
.dt small{display:block;font-size:11px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.04em}
.dt span{font-size:21px;font-weight:660;font-variant-numeric:tabular-nums}
.row.today .dt span,.row.today .dt small{color:var(--accent)}
.rt{flex:1;min-width:0}
.rt b{display:block;font-weight:620}
.rt small{display:block;color:var(--muted);font-size:13.5px;margin-top:1px}
.row.rest .rt b{color:var(--faint);font-weight:500}
.st{font-size:13.5px;color:var(--muted);white-space:nowrap;text-align:right}
.st.ok{color:var(--ok);font-weight:650}
.st.up{color:var(--ok);font-weight:620}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.chev{color:var(--faint);flex:none}.chev svg{width:18px;height:18px}
.next{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border-radius:var(--r);padding:15px 16px;margin:12px 0}
.next span{flex:1}
.next small{display:block;font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.next b{display:block;margin-top:2px}
.next svg{width:18px;height:18px;color:var(--faint)}

/* prontezza */
.rd{display:flex;align-items:center;gap:14px}
.rd .rt small{font-size:13.5px}
.rd .rt small.bad{color:var(--bad)}
.rd .f{width:78px;flex:none}
.sick{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.sick input{width:20px;height:20px;accent-color:var(--accent);margin:0}

/* corsa */
.zrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.zrow:first-child{border-top:0;padding-top:2px}
.zrow i{width:4px;align-self:stretch;border-radius:4px;flex:none}
.zrow .zt{flex:1;min-width:0}
.zrow .zt span{display:block;font-weight:600}
.zrow .zt small{color:var(--muted);font-size:13px}
.zrow b{font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.zrow b small{font-size:12px;color:var(--muted);font-weight:500}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:14px;padding:11px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0;padding-top:2px}
.steps .k{width:108px;flex:none;color:var(--muted);font-size:14px;padding-top:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 0}
.grid2 label{font-size:12.5px;color:var(--muted);font-weight:600;display:block}
.grid2 label .f{margin-top:5px}
.full{grid-column:1/-1}

/* progressi */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 12px}
.kpi{background:var(--card);border-radius:18px;padding:14px}
.kpi small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:24px;font-weight:720;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.prow{padding:14px 16px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.prow .top b{font-weight:620}
.prow .top span{font-size:13.5px;color:var(--muted);text-align:right}
.hist{display:flex;gap:6px;overflow-x:auto;margin-top:9px;scrollbar-width:none}
.hist::-webkit-scrollbar{display:none}
.hist span{flex:none;background:var(--fill);border-radius:10px;padding:5px 9px;font-size:13px;font-variant-numeric:tabular-nums;line-height:1.25}
.hist span small{display:block;font-size:10.5px;color:var(--muted);font-weight:600}
.hist span.cur{background:var(--accentfill)}
.empty{color:var(--faint);font-size:13.5px;margin-top:6px}

/* guida */
.g{background:var(--card);border-radius:var(--r);margin:0 0 10px;padding:0 16px}
.g>summary{padding:15px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;list-style:none;cursor:pointer}
.g>summary b{display:block;font-weight:630}
.g>summary small{display:block;color:var(--muted);font-size:13.5px}
.g>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(45deg);margin:-4px 4px 0 0;flex:none;transition:transform .2s}
.g[open]>summary::after{transform:rotate(225deg);margin-top:4px}
.g .body{padding:0 0 16px;font-size:15px}
.g ul{padding-left:18px;margin:0}
.g li{margin:0 0 10px}
.g p{margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:9px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:650;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;border-top:0}
.muted{color:var(--muted)}
.small{font-size:13.5px}

/* barra in basso */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--tabbg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);z-index:20}
.tabs button{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--faint);padding:4px 0;text-align:center}
.tabs svg{width:25px;height:25px}
.tabs button.on{color:var(--accent)}

/* timer */
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 74px);width:min(528px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:20px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:12px;z-index:30;box-shadow:0 12px 34px rgba(0,0,0,.28)}
#timer[hidden]{display:none}
#timer .tc{font-size:30px;font-weight:740;font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:76px}
#timer .tx{flex:1;min-width:0;line-height:1.25}
#timer .tx small{display:block;font-size:11.5px;opacity:.65;font-weight:650;text-transform:uppercase;letter-spacing:.05em}
#timer .tx span{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.9}
#timer button{height:40px;padding:0 13px;border-radius:12px;background:rgba(127,127,127,.28);font-weight:650;font-size:14px;color:inherit;flex:none}
#timer.go{background:var(--ok);color:#fff}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14.5px;font-weight:600;z-index:40;transition:transform .3s ease;max-width:calc(100% - 32px);text-align:center}
#toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<main id="view"></main>
<div id="timer" hidden><div class="tc" id="tclock">0:00</div><div class="tx"><small id="tlab">Recupero</small><span id="tnext"></span></div><button id="tplus">+15 s</button><button id="tstop">Salta</button></div>
<div id="toast" role="status" aria-live="polite"></div>
<nav class="tabs">
 <button data-tab="oggi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>Oggi</button>
 <button data-tab="sett"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Settimana</button>
 <button data-tab="prog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M7 16.5v-4M12 16.5V7M17 16.5v-7"/></svg>Progressi</button>
 <button data-tab="guida"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.2M12 7.8h.01"/></svg>Guida</button>
</nav>
<script>
'use strict';
// ---------- diario ----------
const KEY='scheda-fc-2026';
let store={};
try{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){store={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const $=s=>document.querySelector(s);
const num=v=>String(Math.round(v*100)/100).replace('.',',');
const pnum=s=>{const v=parseFloat(String(s??'').replace(',','.'));return isFinite(v)?v:null};
// un peso vale solo se il campo contiene un numero e basta (nei vecchi diari il campo dei manubri era una nota)
const kgOf=s=>/^\s*\d{1,3}([.,]\d+)?\s*$/.test(String(s??''))?pnum(s):null;
const BW=68; // peso corporeo, per stimare il carico relativo con lo zaino
const ICON={
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>'
};

// ---------- ritmi (formule VDOT di Daniels) ----------
const vo2=v=>-4.60+0.182258*v+0.000104*v*v;
const pct=t=>0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t);
const vAt=o=>(-0.182258+Math.sqrt(0.182258**2+4*0.000104*(o+4.60)))/(2*0.000104);
const VDOT_PROVV=36.5; // stima da 10 km a 5:42 con FC 167 (27/10) e 5,2 km a 5:13 (16/04)
const vdot=()=>store.vdot||VDOT_PROVV;
function pace(f){const s=Math.round(60000/vAt(f*vdot()));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
const Z={
  E:{n:'Facile',z:'Z2',fc:'135–150',p:()=>pace(.74)+'–'+pace(.65),d:'parli a frasi intere',c:'var(--z1)'},
  M:{n:'Medio',z:'Z3',fc:'151–165',p:()=>pace(.80),d:'ritmo da maratona',c:'var(--z2)'},
  T:{n:'Soglia',z:'Z4',fc:'166–176',p:()=>pace(.88),d:'duro ma controllato, lo terresti un’ora',c:'var(--z3)'},
  I:{n:'Ripetute',z:'Z5',fc:'≥177 a fine ripetuta',p:()=>pace(.975),d:'lo terresti 10–12 minuti',c:'var(--z4)'},
  R:{n:'Allunghi',z:'',fc:'—',p:()=>pace(1.05),d:'veloce e sciolto, mai sprint',c:'var(--z5)'}
};
const zp=k=>`<b>${Z[k].p()}/km</b>`;
function parseT(s){const m=String(s||'').trim().match(/^(\d{1,2})[:.,](\d{2})$/);if(!m)return null;const t=+m[1]+(+m[2])/60;return (t>=13&&t<=50)?t:null}
function setVdotFrom(str){const t=parseT(str);if(!t)return false;store.vdot=vo2(5000/t)/pct(t);store.t5k=String(str).trim();save();return true}
if(!store.vdot){const s=parseT(store.t5k8)?store.t5k8:store.t5k1;if(parseT(s))setVdotFrom(s)}

// ---------- calendario ----------
// le settimane si contano dal 2 novembre 2026: le chiavi del diario (w1, w2…) restano quelle di sempre
const START=new Date(2026,10,2);
const dataDi=(w,d)=>{const x=new Date(START);x.setDate(x.getDate()+w*7+d);return x};
const GG=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const GGL=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const fmt=x=>x.toLocaleDateString('it-IT',{day:'numeric',month:'short'});

// prontezza di Forma: 0 normale · 1 giornata leggera · 2 riposo
function readyLevel(iso){
  const v=pnum(store['ready.'+iso]);
  if(v!==null&&v<30)return 2;
  if((v!==null&&v<40)||store['sick.'+iso])return 1;
  return 0;
}
const lowFor=(w,k)=>readyLevel(isoOf(dataDi(w,dayOf(k))))>=1;

// ---------- il motore della progressione ----------
function logOf(w,id){
  const e=EX[id],S=e.s,sets=[];
  for(let i=1;i<=8;i++){const b=sk(w,S,id,i),r=parseInt(store[b+'.r'],10);if(!isNaN(r)&&r>=0)sets.push({r,kg:kgOf(store[b+'.kg'])})}
  if(!sets.length)return null;
  const b=ek(w,S,id), ks=sets.map(s=>s.kg).filter(v=>v!==null);
  const kg=hasKg(e)?(ks.length?Math.max(...ks):e.kg0):null;
  const lvs=store[b+'.lv'], lv=lvs!=null&&lvs!==''?Math.min(Math.max(0,+lvs||0),e.lv.length-1):0;
  const rir=store[b+'.rir']!=null&&store[b+'.rir']!==''?+store[b+'.rir']:null;
  return {w,sets,kg,lv,rir,dl:!!store[b+'.dl']};
}
function history(id,w){const H=[];for(let p=w-1;p>=0&&H.length<8;p--){const l=logOf(p,id);if(l)H.push(l)}return H}
const fill=(n,v)=>Array(n).fill(v);
const TAG={start:['new','Nuovo'],reps:['','+1 rip'],confirm:['','Conferma'],deload:['dl','Leggera'],down:['dl','−1 passo']};

// cosa fare questa settimana, dato il diario delle settimane prima
function prescribe(id,w,low){
  const e=EX[id],n=e.sets,mid=Math.round((e.lo+e.hi)/2);
  const H=history(id,w), Hn=H.filter(h=>!h.dl);
  const px={kg:e.kg0??null,lv:0,sets:n,reps:fill(n,e.lo),kind:'start',why:e.start||`Prima volta: cerca il punto in cui fai ${e.lo}–${e.hi} ripetizioni pulite.`};
  if(H.length){
    const L=Hn[0]||H[0];
    px.kg=L.kg;px.lv=L.lv;px.last=H[0];
    const top=x=>x&&x.sets.length>=n&&x.sets.slice(0,n).every(s=>s.r>=e.hi);
    const same=(a,b)=>!!a&&!!b&&a.kg===b.kg&&a.lv===b.lv;
    const full=x=>x&&x.sets.length>=n;
    const tot=x=>x.sets.slice(0,n).reduce((t,s)=>t+s.r,0);
    const under=x=>x&&x.sets.slice(0,n).every(s=>s.r<e.lo-1);
    if(top(L)){
      const P=Hn[1];
      if((L.rir!==null&&L.rir>=2)||(same(P,L)&&top(P)))stepUp(e,L,px,mid);
      else{px.reps=fill(n,e.hi);px.kind='confirm';px.why=`Range chiuso, ma al limite${L.rir===null?' (o margine non segnato)':''}: questa settimana lo confermi, poi si sale.`}
    }else{
      const [a,b,c]=Hn, recentDl=H.slice(0,3).some(h=>h.dl);
      if(!recentDl&&same(a,b)&&same(b,c)&&full(a)&&full(b)&&full(c)&&tot(a)<=tot(b)&&tot(b)<=tot(c)){
        px.sets=n-1;px.reps=fill(n-1,e.lo);px.kind='deload';
        px.why='Due settimane senza progressi: settimana leggera. Una serie in meno, stesso carico, lasci 3 ripetizioni di margine. Poi si riparte.';
      }else if(same(a,b)&&under(a)&&under(b)&&stepDown(e,L,px)){
        px.reps=fill(n,e.lo);px.kind='down';
      }else{
        px.reps=Array.from({length:n},(_,i)=>{const s=L.sets[i]||L.sets[L.sets.length-1];return Math.min(e.hi,s.r+1)});
        px.kind='reps';px.why='Stesso carico: una ripetizione in più nelle serie sotto il massimo del range.';
      }
    }
  }
  if(low&&px.sets>1){px.sets--;px.reps=px.reps.slice(0,px.sets);px.low=true}
  return px;
}
function stepUp(e,L,px,mid){
  const n=e.sets, set=v=>{px.reps=fill(n,v)};
  if((e.eq==='db1'||e.eq==='db2'||e.eq==='bar')&&L.kg+5<=e.max){
    const p=5/L.kg;px.kg=L.kg+5;set(p>.1?e.lo:mid);px.kind='up';px.tag='+5 kg';
    px.why=`${e.eq==='db2'?'+5 kg per manubrio':'+5 kg'}: è il ${Math.round(p*100)}% in più, quindi riparti ${p>.1?'dal fondo':'dal centro'} del range.`;return;
  }
  if(e.eq==='pack'){
    const ex=Math.min(...L.sets.slice(0,n).map(s=>s.r))-e.hi;
    const steps=ex>=3?Math.min(3,1+Math.floor(ex/3)):1;
    const inc=L.kg<8.5?8.5-L.kg+1.5*(steps-1):1.5*steps, p=inc/(BW+L.kg);
    px.kg=Math.round((L.kg+inc)*10)/10;set(p>.1?e.lo:mid);px.kind='up';px.tag=`+${num(inc)} kg`;
    px.why=L.kg<8.5?`Si passa allo zaino: ${num(px.kg)} kg. Riparti dal fondo del range.`
      :steps>1?`Eri ${ex} ripetizioni oltre il range: ${steps} bottiglie in più in una volta (stima: circa 1 ripetizione ogni 3% di carico).`
      :'Una bottiglia in più nello zaino (+1,5 kg).';
    return;
  }
  if(px.lv<e.lv.length-1){
    px.lv++;set(e.lo);px.kind='up';px.tag='Più difficile';
    px.why=`${hasKg(e)?'Il peso è al massimo: ':''}ora ${e.lv[px.lv]}. Riparti dal fondo del range.`;return;
  }
  px.reps=fill(n,e.hi);px.kind='max';px.tag='Al massimo';
  px.why='Hai finito le progressioni con questa attrezzatura: tieni il carico e porta l’ultima serie a 1 ripetizione dal cedimento.';
}
function stepDown(e,L,px){
  if((e.eq==='db1'||e.eq==='db2'||e.eq==='bar')&&L.kg-5>=(e.eq==='bar'?16:5)){px.kg=L.kg-5;px.tag='−5 kg';px.why='Due settimane sotto il range: 5 kg in meno, poi si risale.';return true}
  if(e.eq==='pack'&&L.kg>=1.5){px.kg=Math.round((L.kg-1.5)*10)/10;px.tag='−1,5 kg';px.why='Due settimane sotto il range: una bottiglia in meno, poi si risale.';return true}
  if(!hasKg(e)&&L.lv>0){px.lv=L.lv-1;px.tag='Più facile';px.why='Due settimane sotto il range: la variante precedente, poi si risale.';return true}
  return false;
}
const pxOf=(w,id)=>prescribe(id,w,lowFor(w,EX[id].s));
function loadLabel(e,px){
  const lv=e.lv[px.lv]||'';let a='';
  if(e.eq==='db1')a=`1 manubrio · ${num(px.kg)} kg`;
  else if(e.eq==='db2')a=`2 × ${num(px.kg)} kg`;
  else if(e.eq==='bar')a=`bilanciere · ${num(px.kg)} kg`;
  else if(e.eq==='pack')a=px.kg>0?`zaino · ${num(px.kg)} kg`:'corpo libero';
  else if(e.eq==='fix')a='2 × 3 kg';
  return [a,lv].filter(Boolean).join(' · ');
}
const goalTxt=px=>px.reps.every(v=>v===px.reps[0])?`${px.sets} × ${px.reps[0]}`:px.reps.join(' · ');
function tagOf(px){return px.kind==='up'||px.kind==='max'?[px.kind==='up'?'up':'',px.tag]:px.kind==='down'?['dl',px.tag]:TAG[px.kind]}

// ---------- corsa: stessa seduta, progressione per regola ----------
function qPlan(w){
  for(let p=w-1;p>=0;p--){const b=`w${p+1}.q`;
    if(store[b+'.test'])return {N:4,test:false,why:'Dopo il test si riparte da 4 ripetute, con i ritmi nuovi.'};
    const n=pnum(store[b+'.n']),r=pnum(store[b+'.reps']);
    if(n){
      if(r!==null&&r>=n)return n>=6?{N:6,test:true,why:'Hai chiuso 6 × 4 min al ritmo: questa settimana il test dei 5 km aggiorna i ritmi.'}:{N:n+1,test:false,why:`La volta scorsa ${n} su ${n} al ritmo: una ripetuta in più.`};
      return {N:n,test:false,why:r===null?'Stesse ripetute della volta scorsa.':`La volta scorsa ${r} su ${n} al ritmo: stesse ripetute.`};
    }
  }
  return {N:4,test:false,why:'Si parte da 4 ripetute. Quando le chiudi tutte al ritmo, la volta dopo ne aggiungi una, fino a 6; poi il test dei 5 km.'};
}
function maxKm30(w,d){
  const ref=dataDi(w,d);let m=0;
  for(let p=Math.max(0,w-5);p<=w;p++)['q','l'].forEach(k=>{const diff=(ref-dataDi(p,dayOf(k)))/864e5;
    if(diff>0&&diff<=30){const v=pnum(store[`w${p+1}.${k}.km`]);if(v!==null&&v>m)m=v}});
  return m;
}
function lPlan(w){
  let M=60,why='Si parte da 60 min: ogni settimana 5 min in più, fino a 90.';
  for(let p=w-1;p>=0;p--){const b=`w${p+1}.l`,pres=pnum(store[b+'.pres']);
    if(!pres)continue;
    const min=pnum(store[b+'.min'])??(store[`done.w${p+1}.l`]?pres:null);
    if(min===null){M=pres;why='Durata della volta scorsa non registrata: stessa durata.'}
    else if(min>=pres-1){M=Math.min(90,pres+5);why=M===pres?'Sei a 90 min: il lungo resta qui.':'Fatto per intero la volta scorsa: +5 min.'}
    else{M=pres;why='La volta scorsa più corto del previsto: stessa durata.'}
    break;
  }
  const mx=maxKm30(w,dayOf('l'));
  return {M,why,cap:mx?Math.round(mx*1.1*10)/10:null};
}
function snapRun(w,k){
  const b=`w${w+1}.${k}`;
  if(k==='q'){const q=qPlan(w);if(q.test){store[b+'.test']=1;delete store[b+'.n']}else{store[b+'.n']=String(q.N);delete store[b+'.test']}}
  else store[b+'.pres']=String(lPlan(w).M);
}
function runTitle(w,k){if(k==='q'){const q=qPlan(w);return q.test?'Test 5 km':`Ripetute ${q.N} × 4 min`}return `Lungo ${lPlan(w).M} min`}
function titleOf(w,k){return SESS[k]?`${SESS[k].title} · ${SESS[k].sub.toLowerCase()}`:runTitle(w,k)}

// ---------- viste: una seduta di forza ----------
function progress(w,S){let tot=0,done=0;idsOf(S).forEach(id=>{const n=pxOf(w,id).sets;tot+=n;for(let i=1;i<=n;i++)if(store[sk(w,S,id,i)+'.ok'])done++});return {tot,done}}
function exHTML(w,S,id){

  let last='';
  if(px.last){const L=px.last;last=`<p class="why">La volta scorsa: <span class="num">${L.sets.map(s=>s.r).join(' · ')}</span>${kgOn&&L.kg!=null?' · '+(e.eq==='pack'?(L.kg?`zaino ${num(L.kg)} kg`:'corpo libero'):`${num(L.kg)} kg`):''}${e.lv.length>1&&e.lv[L.lv]?' · '+e.lv[L.lv]:''}</p>`}
  let rows=`<span class="h">Serie</span>${kgOn?'<span class="h">Kg</span>':''}<span class="h">Ripetizioni</span><span></span>`, all=true;
  for(let i=1;i<=px.sets;i++){
    const b=sk(w,S,id,i),on=!!store[b+'.ok'];if(!on)all=false;
    rows+=`<span class="n">${i}</span>${kgOn?`<input class="f" data-k="${b}.kg" inputmode="decimal" placeholder="${num(px.kg)}" value="${esc(store[b+'.kg'])}" aria-label="Kg, serie ${i}">`:''}<input class="f" data-k="${b}.r" inputmode="numeric" placeholder="${px.reps[i-1]}" value="${esc(store[b+'.r'])}" aria-label="Ripetizioni, serie ${i}"><button class="ck${on?' on':''}" data-ok="${w}|${S}|${id}|${i}" aria-label="Serie ${i} fatta">${ICON.check}</button>`;
  }
  const rv=store[ek(w,S,id)+'.rir'];
  const rir=`<div class="rir"><span>Ripetizioni di margine<br>nell’ultima serie</span><div class="seg">${['0','1','2','3+'].map((l,v)=>`<button class="${rv!=null&&rv!==''&&+rv===v?'on':''}" data-rir="${w}|${S}|${id}|${v}">${l}</button>`).join('')}</div></div>`;
  return `<article class="ex${all?' complete':''}" id="ex-${id}">
   <div class="exh"><div><h3>${e.n}</h3><p class="load">${loadLabel(e,px)}${e.unit?' · '+e.unit:''}</p></div>${tt?`<span class="tag ${tc}">${esc(tt)}</span>`:''}</div>
   <div class="goal"><b>${goalTxt(px)}</b><small>range ${e.lo}–${e.hi} · recupero ${e.rest} s</small></div>
   <p class="why">${px.why}${px.low?' <b>Prontezza bassa:</b> una serie in meno e una ripetizione di margine in più.':''}</p>${last}
   <div class="sets${kgOn?'':' nokg'}">${rows}</div>${rir}
   <details class="how"><summary>Come si fa</summary><p>${e.how}</p></details></article>`;
}
function platesHTML(w){
  const o=pxOf(w,'ohp').kg,c=pxOf(w,'bcurl').kg,off=25-o,add=c-16;
  let t=off>0?`Porta i due manubri da 25 a <b>${num(o)} kg</b>: togli ${num(off/2)} kg per lato a ciascuno.`:'I manubri restano a 25 kg.';
  t+=add>0?` Sul bilanciere metti <b>${num(add/2)} kg per lato</b> (${num(c)} kg in tutto)${off*2>=add?', presi da quelli che hai tolto':''}.`:' Il bilanciere resta a 16 kg.';
  return `<div class="note info"><b>Cambio dischi, una volta sola.</b> ${t} A fine seduta rimonta i manubri a 25: martedì si riparte da lì.</div>`;
}
function strBody(w,S){
  const m=SESS[S];let gi=0;
  let h=`<details class="note"><summary><span><b>Riscaldamento</b> · <span class="muted">${m.eq}</span></span></summary><p>${m.warm}</p></details>`;
  m.groups.forEach(g=>{
    if(g==='PLATES'){h+=`<div style="height:10px"></div>`+platesHTML(w);return}
    gi++;h+=`<div class="pair">${g.length>1?`Coppia ${gi} · alterna i due`:`Esercizio ${gi}`}</div>`+g.map(id=>exHTML(w,S,id)).join('');
  });
  return h;
}
function nextWeekHTML(w,S){
  return `<div class="sec">La prossima settimana</div><div class="list">${idsOf(S).map(id=>{const e=EX[id],px=prescribe(id,w+1,false),[tc,tt]=tagOf(px);
    return `<div class="row"><div class="rt"><b>${e.n}</b><small>${goalTxt(px)} · ${loadLabel(e,px)}</small></div><span class="st ${tc==='up'?'up':''}">${esc(tt||'')}</span></div>`}).join('')}</div>
   <p class="foot">Calcolato da quello che hai scritto oggi. Se correggi una serie, si aggiorna.</p>`;
}

// ---------- viste: una corsa ----------
function zoneRows(zs){return `<div class="card">${zs.map(z=>`<div class="zrow"><i style="background:${Z[z].c}"></i><div class="zt"><span>${Z[z].n}</span><small>${z==='E'?'comanda la FC · '+Z[z].fc:z==='R'?Z[z].d:'comanda il ritmo · FC '+Z[z].fc}</small></div><b>${Z[z].p()}<small>/km</small></b></div>`).join('')}</div>`}
function stepsHTML(st){return `<div class="card"><ul class="steps">${st.map(([a,b])=>`<li><span class="k">${a}</span><span>${b}</span></li>`).join('')}</ul></div>`}
const inp=(k,ph,mode,cls='')=>`<input class="f ${cls}" data-k="${k}" placeholder="${ph}" inputmode="${mode}" value="${esc(store[k])}">`;
function runBody(w,k,lvl){
  const b=`w${w+1}.${k}`;let h='';
  if(k==='q'){
    const q=qPlan(w);
    if(lvl>=1){
      h+=`<div class="note bad">Prontezza bassa: oggi la qualità diventa <b>30 min facili</b>, a ${zp('E')} (FC ${Z.E.fc}).</div>`;
      return h+`<div class="sec">Com’è andata</div><div class="card"><div class="grid2"><label>km${inp(b+'.km','km','decimal')}</label><label>FC media${inp(b+'.fc','bpm','numeric')}</label><label class="full">Note${inp(b+'.note','sensazioni','text','l')}</label></div></div>`;
    }
    if(q.test){
      h+=`<p class="why" style="margin:0 4px 12px">${q.why}</p>`+stepsHTML([['Riscaldamento',RISC],['Test','5 km a tutta, su un percorso piatto che puoi ripetere. Il primo km non più veloce del secondo: finisci in crescendo.'],['Defaticamento','10 min molto facile']]);
      return h+`<div class="sec">Com’è andata</div><div class="card"><div class="grid2"><label class="full">Tempo sui 5 km${inp(b+'.t5k','mm:ss','numeric')}</label><label>km totali${inp(b+'.km','km','decimal')}</label><label>FC media${inp(b+'.fc','bpm','numeric')}</label></div><p class="why">Il tempo aggiorna da solo i ritmi di tutta l’app.</p></div>`;
    }
    h+=`<p class="why" style="margin:0 4px 12px">${q.why}</p>`+zoneRows(['I','E','R'])+stepsHTML([['Riscaldamento',RISC],['Ripetute',`<b>${q.N} × 4 min</b> a ritmo ripetute, ${zp('I')} · recupero 3 min corricchiando`],['Defaticamento','10 min molto facile']]);
    const rv=store[b+'.reps'];
    return h+`<div class="sec">Com’è andata</div><div class="card"><div class="rir stack" style="margin-top:0"><span>Ripetute chiuse al ritmo</span><div class="seg">${Array.from({length:q.N+1},(_,v)=>`<button class="${rv!=null&&rv!==''&&+rv===v?'on':''}" data-qr="${w}|${v}">${v}</button>`).join('')}</div></div>
      <div class="grid2"><label>km${inp(b+'.km','km','decimal')}</label><label>FC media${inp(b+'.fc','bpm','numeric')}</label><label class="full">Note${inp(b+'.note','sensazioni','text','l')}</label></div></div>`;
  }
  const l=lPlan(w);
  h+=`<p class="why" style="margin:0 4px 12px">${l.why}</p>`+zoneRows(['E'])+stepsHTML([['Corsa',`<b>${l.M} min</b> in zona facile, ${zp('E')}. Se la FC supera 150, rallenta anche se il ritmo sembra ridicolo.`]]);
  if(l.cap)h+=`<div class="note warn">Non oltre <b>${num(l.cap)} km</b>: il 10% in più della corsa più lunga degli ultimi 30 giorni. Se ci arrivi prima del tempo, ti fermi.</div>`;
  return h+`<div class="sec">Com’è andata</div><div class="card"><div class="grid2"><label>Minuti${inp(b+'.min',String(l.M),'numeric')}</label><label>km${inp(b+'.km','km','decimal')}</label><label>FC media${inp(b+'.fc','bpm','numeric')}</label><label>Note${inp(b+'.note','—','text','l')}</label></div></div>`;
}

// ---------- viste: un giorno ----------
function readyCard(iso){
  const v=store['ready.'+iso]||'',l=readyLevel(iso);
  const msg=v===''&&!store['sick.'+iso]?'Il valore di Forma di stamattina: la seduta si adatta.':l===2?'Sotto 30: oggi riposo.':l===1?'Giornata leggera, già applicata qui sotto.':'Via libera: seduta piena.';
  return `<div class="card"><div class="rd"><div class="rt"><b>Prontezza</b><small class="${l?'bad':''}">${msg}</small></div><input class="f" data-ready="${iso}" inputmode="numeric" placeholder="—" value="${esc(v)}" aria-label="Prontezza di Forma"></div>
   <label class="sick"><input type="checkbox" data-sick="${iso}" ${store['sick.'+iso]?'checked':''}>Ho due segnali di malessere</label></div>`;
}
function nextCard(w,d){
  const t=oggi();let x=w*7+d+1;
  for(let j=0;j<14;j++,x++){const ww=Math.floor(x/7),dd=x%7;
    if(PLAN[dd].length){const diff=x-t.raw,when=diff===1?'Domani':`${GGL[dd]} ${dataDi(ww,dd).getDate()}`;
      return `<button class="next" data-day="${ww}|${dd}"><span><small>Prossima · ${when}</small><b>${titleOf(ww,PLAN[dd][0])}</b></span>${ICON.right}</button>`}}
  return '';
}
function dayHTML(w,d,fromWeek){
  const x=dataDi(w,d),t=oggi(),isT=t.raw===w*7+d,ks=PLAN[d],iso=isoOf(x);
  const back=fromWeek?`<button class="back" data-back>${ICON.left}Settimana</button>`:'';
  const eb=`${isT?'Oggi · ':''}${GGL[d]} ${fmtL(x)}`;
  if(!ks.length)return back+`<header class="hd"><div class="eb">${eb}</div><h1>Riposo</h1><p class="sub">Il recupero fa parte dell’allenamento. Se vuoi muoverti, una camminata.</p></header>`+nextCard(w,d)+(isT?exportReminder():'');
  const k=ks[0],lvl=readyLevel(iso),done=isDone(w,k);
  let head,body;
  if(SESS[k]){const m=SESS[k],p=progress(w,k);
    head=`<header class="hd"><div class="eb">${eb}</div><h1>${m.title}</h1><p class="sub">${m.sub} · ${m.dur} · <span data-prog="${w}|${k}">${p.done} di ${p.tot} serie</span></p><div class="bar"><i data-bar="${w}|${k}" style="width:${p.tot?p.done/p.tot*100:0}%"></i></div></header>`;
    body=strBody(w,k);
  }else{
    head=`<header class="hd"><div class="eb">${eb}</div><h1>${lvl>=1&&k==='q'?'Corsa facile':runTitle(w,k)}</h1><p class="sub">${k==='q'?'Corsa · qualità · ~50 min':'Corsa · lungo facile'}</p></header>`;
    body=runBody(w,k,lvl);
  }
  let h=back+head+(isT?readyCard(iso):'');
  h+=lvl===2?`<details class="note"><summary><b>Mostra comunque la seduta</b></summary></details>`+`<div hidden data-anyway>${body}</div>`:body;
  h+=`<button class="btn ${done?'done':''}" data-done="${w}|${k}">${done?ICON.check+'Seduta fatta · tocca per annullare':'Concludi la seduta'}</button>`;
  if(done&&SESS[k])h+=nextWeekHTML(w,k);
  if(isT)h+=nextCard(w,d)+exportReminder();
  return h;
}
function hasData(){return Object.keys(store).some(k=>/^(w\d|t)/.test(k)&&store[k])}
function exportReminder(){
  if(!hasData())return '';
  const last=store.lastExport?Math.round((new Date()-new Date(store.lastExport))/864e5):null;
  if(last!==null&&last<14)return '';
  return `<div class="card"><b>Fai una copia del diario</b><p class="why" style="margin:4px 0 12px">I dati stanno solo in questo browser. ${last===null?'Non hai mai esportato.':`Ultima copia ${last} giorni fa.`}</p><button class="btn ghost sm" data-exp style="background:var(--fill)">Esporta il diario</button></div>`;
}

// ---------- viste: la settimana ----------
function weekView(w){
  const t=oggi();let y=0,tot=0;
  const rows=PLAN.map((ks,d)=>{
    const x=dataDi(w,d),isT=t.raw===w*7+d,past=w*7+d<t.raw;
    const dt=`<span class="dt"><small>${GG[d]}</small><span>${x.getDate()}</span></span>`;
    if(!ks.length)return `<div class="row rest ${isT?'today':''}">${dt}<span class="rt"><b>Riposo</b></span></div>`;
    const k=ks[0],dn=isDone(w,k);tot++;if(dn)y++;
    const color=SESS[k]?`var(--${k})`:'var(--run)';
    const sub=SESS[k]?`${SESS[k].sub} · ${idsOf(k).length} esercizi`:k==='q'?'Corsa · qualità':'Corsa · facile';
    const st=dn?`<span class="st ok">Fatta</span>`:isT?`<span class="st" style="color:var(--accent);font-weight:650">Oggi</span>`:past?`<span class="st">Saltata</span>`:'';
    return `<button class="row ${isT?'today':''}" data-day="${w}|${d}">${dt}<span class="rt"><b><i class="dot" style="background:${color}"></i>${SESS[k]?SESS[k].title:runTitle(w,k)}</b><small>${sub}</small></span>${st}<span class="chev">${ICON.right}</span></button>`;
  }).join('');
  const lab=w===t.w?'Questa settimana':w===t.w+1?'Prossima settimana':w<t.w?'Settimana passata':'Settimana';
  return `<header class="hd"><div class="hdrow"><div><div class="eb">${lab}</div><h1>${weekLabel(w)}</h1></div>
    <div class="navs"><button class="rb" data-w="${w-1}" ${w<=0?'disabled':''} aria-label="Settimana prima">${ICON.left}</button><button class="rb" data-w="${w+1}" ${w>=t.w+1?'disabled':''} aria-label="Settimana dopo">${ICON.right}</button></div></div>
    <p class="sub">${y} di ${tot} sedute fatte${w!==t.w?` · <button data-w="${t.w}" style="color:var(--accent)">torna a oggi</button>`:''}</p></header>
   <div class="list">${rows}</div>
   <p class="foot">La scheda è uguale ogni settimana: cambiano solo gli obiettivi, che l’app calcola dal diario. Una seduta saltata non si recupera: si riparte dalla successiva.</p>`;
}

// ---------- viste: progressi ----------
function progView(){
  const t=oggi(),w=Math.max(0,t.w);
  let sessions=0;Object.keys(store).forEach(k=>{if(/^done\.w\d+\./.test(k)&&store[k])sessions++});
  let ups=0;Object.keys(EX).forEach(id=>{const H=history(id,w+1).reverse();for(let i=1;i<H.length;i++)if(H[i].kg>H[i-1].kg||H[i].lv>H[i-1].lv)ups++});
  const kpi=`<div class="kpis"><div class="kpi"><small>Sedute fatte</small><b>${sessions}</b></div><div class="kpi"><small>Passi avanti</small><b>${ups}</b></div><div class="kpi"><small>VDOT</small><b>${num(vdot().toFixed(1))}</b></div></div>`;
  const sec=S=>`<div class="sec">${SESS[S].title} · ${SESS[S].sub.toLowerCase()}</div><div class="list">${idsOf(S).map(id=>{
    const e=EX[id],px=pxOf(w,id),H=history(id,w+1).slice(0,6).reverse();
    const chips=H.length?`<div class="hist">${H.map(h=>`<span class="${h.w===w?'cur':''}"><small>${fmt(dataDi(h.w,0))}</small>${h.sets.map(s=>s.r).join('·')}${hasKg(e)&&h.kg?` @${num(h.kg)}`:''}${!hasKg(e)||e.lv.length>1?(h.lv?` · L${h.lv+1}`:''):''}</span>`).join('')}</div>`:'<p class="empty">Ancora nessun dato.</p>';
    return `<div class="prow"><b>${e.n}</b><div class="why" style="margin:1px 0 0">Questa settimana: <b class="num" style="color:var(--ink)">${goalTxt(px)}</b> · ${loadLabel(e,px)}</div>${chips}</div>`}).join('')}</div>`;
  const tests=[];for(let p=0;p<=w;p++){const v=store[`w${p+1}.q.t5k`];if(parseT(v))tests.push([p,v])}
  if(parseT(store.t5k1))tests.unshift([0,store.t5k1]);
  const longs=[];for(let p=Math.max(0,w-7);p<=w;p++){const m=pnum(store[`w${p+1}.l.min`]),km=pnum(store[`w${p+1}.l.km`]);if(m||km)longs.push([p,m,km])}
  const run=`<div class="sec">Corsa</div><div class="list">
    <div class="prow"><div class="top"><b>Qualità</b><span>${runTitle(w,'q')}</span></div></div>
    <div class="prow"><div class="top"><b>Lungo</b><span>${lPlan(w).M} min</span></div>${longs.length?`<div class="hist">${longs.map(([p,m,km])=>`<span class="${p===w?'cur':''}"><small>${fmt(dataDi(p,3))}</small>${m?m+' min':''}${m&&km?' · ':''}${km?num(km)+' km':''}</span>`).join('')}</div>`:'<p class="empty">Ancora nessun dato.</p>'}</div>
    <div class="prow"><div class="top"><b>Test 5 km</b><span>${store.t5k?esc(store.t5k):'non ancora'}</span></div>${tests.length?`<div class="hist">${tests.map(([p,v])=>`<span><small>${fmt(dataDi(p,0))}</small>${esc(v)}</span>`).join('')}</div>`:''}</div></div>`;
  return `<header class="hd"><div class="eb">Dal tuo diario</div><h1>Progressi</h1><p class="sub">Per ogni esercizio: l’obiettivo di questa settimana e le ultime volte (ripetizioni · kg · livello).</p></header>`+kpi+sec('A')+sec('C')+sec('B')+run;
}

// ---------- viste: guida ----------
const g=(t,sub,body,open)=>`<details class="g" ${open?'open':''}><summary><span><b>${t}</b><small>${sub}</small></span></summary><div class="body">${body}</div></details>`;
const dot=v=>`<i class="dot" style="background:var(--${v})"></i>`;
function guideView(){
  const last=store.lastExport?new Date(store.lastExport).toLocaleDateString('it-IT'):'mai';
  return `<header class="hd"><div class="eb">Come funziona</div><h1>Guida</h1><p class="sub">Una scheda fissa: cinque giorni, due corse e tre sedute di forza, uguali ogni settimana. Cambiano solo gli obiettivi, che l’app calcola da quello che scrivi.</p></header>`+
  g('Come sale la scheda','La regola che l’app applica da sola',`<p>Ogni esercizio ha un numero fisso di <b>serie</b> e un <b>range di ripetizioni</b>. Ti fermi quando ti restano 1–2 ripetizioni pulite, e dopo l’ultima serie segni il <b>margine</b>: quante ne avresti fatte ancora.</p>
   <table><tr><th>Cosa è successo</th><th>La settimana dopo</th></tr>
   <tr><td>Non hai chiuso il range in tutte le serie</td><td>Stesso carico, <b>+1 ripetizione</b> nelle serie rimaste indietro</td></tr>
   <tr><td>Range chiuso, margine 0–1</td><td>Stesso carico: lo <b>confermi</b></td></tr>
   <tr><td>Range chiuso con margine 2+, o confermato</td><td><b>Si sale</b>: +5 kg, una bottiglia, o la variante più difficile</td></tr>
   <tr><td>Salto oltre il 10% del carico</td><td>Riparti dal <b>fondo</b> del range; sotto il 10%, dal centro</td></tr>
   <tr><td>Due settimane senza progressi</td><td><b>Settimana leggera</b>: una serie in meno, stesso carico, 3 di margine</td></tr>
   <tr><td>Due settimane sotto il range</td><td>Un passo indietro, poi si risale</td></tr></table>
   <p style="margin-top:12px">Quando i manubri sono già a 25 kg si sale con la variante: discesa in 3 s, poi pausa, poi ripetizioni 1½. Con lo zaino, se vai molto oltre il range, l’app aggiunge più bottiglie insieme (stima: circa 1 ripetizione ogni 3% di carico).</p>
   <p class="small muted">Cosa è evidenza e cosa è convenzione: lo trovi in «Le evidenze».</p>`,true)+
  g('Ritmi e zone','Dal test dei 5 km, con le formule di Daniels',`<p>FC massima 190 (la più alta registrata), FC a riposo 43. ${store.vdot?`Ritmi calcolati dal tuo 5 km in <b>${esc(store.t5k)}</b> (VDOT ${num(store.vdot.toFixed(1))}).`:`Ritmi stimati (VDOT ${num(VDOT_PROVV)}) finché non registri un test.`}</p>
   <div class="grid2" style="margin:0 0 14px;align-items:end"><label>Tempo sui 5 km<input class="f" id="t5k" placeholder="26:30" inputmode="numeric" value="${esc(store.t5k)}"></label><button class="btn sm" data-calc style="height:44px">Ricalcola</button></div>
   ${Object.values(Z).map(z=>`<div class="zrow"><i style="background:${z.c}"></i><div class="zt"><span>${z.n}${z.z?' · '+z.z:''}</span><small>FC ${z.fc} · ${z.d}</small></div><b>${z.p()}<small>/km</small></b></div>`).join('')}
   <p class="small muted" style="margin-top:12px">Nel lungo comanda la <b>FC</b>; nelle ripetute il <b>ritmo</b>, perché la FC arriva in ritardo. Da gennaio a ottobre la FC media delle tue corse era 160–170: sempre in soglia. Per questo il lungo è davvero facile e la corsa dura è una sola.</p>`)+
  g('La settimana','Cosa si fa ogni giorno e come spostare le sedute',`<table>
    <tr><th>Giorno</th><th>Seduta</th></tr>
    <tr><td>Lun</td><td>${dot('run')}<b>Qualità</b> · ripetute da 4 min</td></tr>
    <tr><td>Mar</td><td>${dot('A')}<b>Forza A</b> · gambe e tirate</td></tr>
    <tr><td>Mer</td><td>${dot('C')}<b>Forza C</b> · parte alta, corta</td></tr>
    <tr><td>Gio</td><td>${dot('run')}<b>Lungo facile</b></td></tr>
    <tr><td>Ven</td><td class="muted">Riposo</td></tr>
    <tr><td>Sab</td><td>${dot('B')}<b>Forza B</b> · spinta, spalle e braccia</td></tr>
    <tr><td>Dom</td><td class="muted">Riposo</td></tr></table>
   <p style="margin-top:12px">La domenica è sempre libera, e mai due sedute nello stesso giorno. Gli altri giorni si spostano rispettando due vincoli: <b>mai Forza A il giorno prima della qualità</b> e <b>qualità e lungo non in giorni consecutivi</b>. In ordine di importanza: qualità, lungo, Forza A, Forza B, Forza C.</p>`)+
  g('Attrezzatura e dischi','Come si allena con quello che hai',`<ul>
    <li><b>Manubri.</b> Martedì restano a 25 + 25 tutta la seduta. Sabato si parte a 25, poi un solo cambio: i dischi si tolgono per il lento avanti e quelli che servono vanno sul bilanciere. A fine seduta si rimontano a 25. I dischi da 2,5 kg vanno uno per lato, quindi il salto minimo è <b>5 kg per manubrio</b>.</li>
    <li><b>Bilanciere.</b> 16 kg, dischi aggiungibili: il salto minimo è 5 kg (2,5 per lato).</li>
    <li><b>Zaino.</b> 8,5 kg vuoto, più bottiglie da 1,5 L. Ogni esercizio con lo zaino ha il suo carico: si cambia aggiungendo o togliendo bottiglie, non dischi.</li>
    <li><b>Coppia da 3 kg.</b> Alzate laterali e posteriori, vicino al cedimento.</li>
    <li><b>Rotella e sbarra, parallele, panca.</b> La rotella sostituisce il rollout con il bilanciere.</li>
    <li><b>Bici.</b> 5 min all’inizio delle sedute di forza. Sostituisce il lungo se hai un fastidio da impatto: stessa durata, stessa FC.</li></ul>`)+
  g('Regole che valgono sempre','Coppie, prontezza, dolore, sonno',`<ul>
    <li><b>Le coppie.</b> Si alternano: primo esercizio, recupero, secondo, recupero, di nuovo il primo. Quando spunti una serie parte il timer e ti dice cosa viene dopo. Se spunti senza scrivere, l’app registra l’obiettivo.</li>
    <li><b>Prontezza di Forma.</b> <b>Sotto 40</b>, o con due segnali di malessere: una serie in meno e un margine in più nella forza, e la qualità diventa 30 min facili. <b>Sotto 30</b>: riposo.</li>
    <li><b>Dolore.</b> Un fastidio che resta uguale o cala correndo si monitora. Uno che <b>peggiora correndo</b> ferma la corsa: per 3–5 giorni la bici, con stessa durata e stessa FC.</li>
    <li><b>Sonno e proteine.</b> Sotto le 7 ore calano forza, resistenza e recupero: a ottobre eri a 6,4. Proteine: almeno 1,6 g/kg al giorno (circa 110 g); i tuoi 140 g sono dentro il margine utile.</li></ul>`)+
  g('Le evidenze','Cosa è dimostrato e cosa è convenzione',`<ul>
    <li><b>Salire con le ripetizioni o con i kg dà risultati simili</b>: in 8 settimane, differenze di forza e massa trascurabili. <a href="https://doi.org/10.7717/peerj.14142">Plotkin et al., PeerJ 2022</a></li>
    <li><b>La soglia per salire</b> (1–2 ripetizioni oltre il range per due sedute, poi +2–10%) è un consenso di esperti, non un esperimento. <a href="https://doi.org/10.1249/MSS.0b013e3181915670">ACSM, MSSE 2009</a>. La posizione ACSM 2026 non fissa percentuali: chiede progressione per chi vuole continuare a migliorare. <a href="https://doi.org/10.1249/MSS.0000000000003897">ACSM, MSSE 2026</a></li>
    <li><b>Il margine sbaglia di circa 1 ripetizione</b>: si crede di essere più vicini al cedimento di quanto si è, e sopra le 12 ripetizioni l’errore cresce. Per questo con margine 2+ si sale subito, con 0–1 si conferma. <a href="https://doi.org/10.1007/s40279-021-01559-x">Halperin et al., Sports Medicine 2022</a></li>
    <li><b>Regolare il carico sul margine</b> funziona almeno quanto le percentuali fisse. <a href="https://doi.org/10.3389/fphys.2018.00247">Helms et al., Frontiers in Physiology 2018</a>; <a href="https://doi.org/10.1186/s40798-021-00404-9">Hickmott et al., Sports Medicine Open 2022</a></li>
    <li><b>Il cedimento non serve</b>, ma avvicinarsi aiuta la crescita muscolare più della forza. <a href="https://doi.org/10.1007/s40279-022-01784-y">Refalo et al., Sports Medicine 2023</a>; <a href="https://doi.org/10.1007/s40279-024-02069-2">Robinson et al., Sports Medicine 2024</a></li>
    <li><b>Carichi leggeri, stessa crescita</b> da circa il 30% del massimale in su, se vicino al cedimento; la forza massima preferisce i carichi pesanti. Da qui i 25 kg con varianti più dure. <a href="https://doi.org/10.1249/MSS.0000000000002585">Lopez et al., MSSE 2021</a>; <a href="https://doi.org/10.3390/sports9020032">Schoenfeld et al., Sports 2021</a></li>
    <li><b>Discesa lenta e pausa</b>: crescita simile con ripetizioni da 0,5 a 8 s; oltre i 10 s rende meno. <a href="https://doi.org/10.1007/s40279-015-0304-0">Schoenfeld et al., Sports Medicine 2015</a></li>
    <li><b>Varianti a corpo libero</b> più difficili fanno crescere la forza come i pesi. <a href="https://doi.org/10.1519/JSC.0000000000000589">Calatayud et al., JSCR 2015</a>; <a href="https://doi.org/10.1519/JSC.0000000000002345">Kotarsky et al., JSCR 2018</a></li>
    <li><b>Volume</b>: circa 10 serie a settimana per muscolo, con rendimenti decrescenti, prima per la forza. <a href="https://doi.org/10.1007/s40279-025-02344-w">Pelland et al., Sports Medicine 2026</a></li>
    <li><b>Settimana leggera, non stop</b>: una settimana di stop completo non aiuta e può costare un po’ di forza; gli esperti consigliano di ridurre serie e vicinanza al cedimento, a calendario o su segnale. <a href="https://doi.org/10.7717/peerj.16777">Coleman et al., PeerJ 2024</a>; <a href="https://doi.org/10.1186/s40798-023-00633-0">Bell et al., Sports Medicine Open 2023</a></li>
    <li><b>Più bottiglie insieme</b>: la stima «1 ripetizione ogni 3% di carico» è una nostra deduzione dalle tabelle ripetizioni–carico. <a href="https://doi.org/10.1007/s40279-023-01937-7">Nuzzo et al., Sports Medicine 2024</a></li>
    <li><b>Il lungo</b>: il rischio di infortunio sale quando un’uscita supera di oltre il 10% la più lunga degli ultimi 30 giorni; la «regola del 10% a settimana» invece non protegge. <a href="https://doi.org/10.1136/bjsports-2024-109380">Frandsen et al., BJSM 2025</a>; <a href="https://doi.org/10.1177/0363546507307505">Buist et al., AJSM 2008</a></li>
    <li><b>Le ripetute</b>: 4 × 4 min alla massima intensità sostenibile alzano il VO2max più della corsa continua (Helgerud et al., MSSE 2007). Aggiungere una ripetuta alla volta è <b>solo convenzione</b>: non ci sono studi che confrontino i modi di farle crescere.</li>
    <li><b>Senza salti</b>: pliometria e forza pesante migliorano l’economia di corsa; qui non ci sono per tua scelta. <a href="https://repositorio.unab.cl/handle/ria/62074">Llanos-Lagos et al., Sports Medicine 2024</a></li>
    <li><b>Forza e corsa insieme</b> non frenano crescita muscolare né forza massima. <a href="https://researchonline.jcu.edu.au/71546/1/Schumann2021_Article_CompatibilityOfConcurrentAerob.pdf">Schumann et al., Sports Medicine 2022</a>. <b>Esercizi in coppia</b>: sedute più brevi, stessi risultati. <a href="https://eprints.leedsbeckett.ac.uk/id/eprint/11908">Zhang et al., Sports Medicine 2025</a>. <b>Recuperi</b> oltre 60 s un po’ meglio, oltre 90 s non cambia. <a href="https://www.frontiersin.org/journals/sports-and-active-living/articles/10.3389/fspor.2024.1429789/abstract">Singer et al., Frontiers 2024</a></li>
    <li><b>Ritmi</b>: formule VDOT di Jack Daniels. <b>Prontezza</b>: seguire la HRV dà un piccolo vantaggio sul VO2max (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7663087/">Granero-Gallegos et al., 2020</a>). <b>Proteine</b>: Morton et al., BJSM 2018. <b>Sonno</b>: Craven et al., Sports Medicine 2022.</li></ul>`)+
  g('Il diario','Ultima copia: '+last,`<p>Quello che scrivi è salvato solo in questo browser, su questo dispositivo: non va su internet. Esporta ogni tanto una copia; con «Importa» la porti su un altro dispositivo.</p>
   <div style="display:flex;flex-wrap:wrap;gap:10px"><button class="btn sm" data-exp>Esporta il diario</button><label class="btn sm ghost" style="background:var(--fill)">Importa un diario<input type="file" data-imp accept="application/json" hidden></label></div>`)+
  `<p class="foot">Scheda costruita sui dati di Forma e sui tuoi carichi. Non sostituisce un parere medico.</p>`;
}

// ---------- disegno ----------
let S={tab:'oggi',w:0,day:null},renderedDay='';
function render(keep){
  const y=window.scrollY,t=oggi();let h;
  if(S.tab==='oggi')h=dayHTML(t.w,t.d,false);
  else if(S.tab==='sett')h=S.day?dayHTML(S.day[0],S.day[1],true):weekView(S.w);
  else if(S.tab==='prog')h=progView();
  else h=guideView();
  $('#view').innerHTML=h;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  renderedDay=isoOf(new Date());
  window.scrollTo(0,keep?y:0);
}
function go(tab){S.tab=tab;if(tab==='sett'){S.day=null;S.w=Math.max(0,oggi().w)}render(false)}

// ---------- feedback ----------
let toastId=0;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastId);toastId=setTimeout(()=>el.classList.remove('on'),2400)}
let actx=null;
function unlockAudio(){try{if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC()}if(actx&&actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){try{if(!actx)return;[0,.25,.5].forEach(o=>{const os=actx.createOscillator(),gn=actx.createGain();os.frequency.value=880;gn.gain.setValueAtTime(.0001,actx.currentTime+o);gn.gain.exponentialRampToValueAtTime(.3,actx.currentTime+o+.02);gn.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+o+.18);os.connect(gn).connect(actx.destination);os.start(actx.currentTime+o);os.stop(actx.currentTime+o+.2)})}catch(e){}}
let wl=null;
async function keepAwake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}

// ---------- timer di recupero ----------
const T={end:0,next:'',id:0,fired:false};
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function startRest(sec,next){T.end=Date.now()+sec*1000;T.next=next;T.fired=false;$('#timer').hidden=false;clearInterval(T.id);T.id=setInterval(tick,250);tick()}
function stopRest(){clearInterval(T.id);$('#timer').hidden=true;$('#timer').classList.remove('go')}
function tick(){
  const left=Math.ceil((T.end-Date.now())/1000),el=$('#timer');
  if(left>0){el.classList.remove('go');$('#tlab').textContent='Recupero';$('#tclock').textContent=mmss(left);$('#tnext').textContent=T.next?'Poi: '+T.next:'';$('#tstop').textContent='Salta';$('#tplus').hidden=false}
  else{
    if(!T.fired){T.fired=true;beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
    el.classList.add('go');$('#tlab').textContent='Recupero finito';$('#tclock').textContent='Vai';$('#tnext').textContent=T.next||'';$('#tstop').textContent='OK';$('#tplus').hidden=true;
    if(Date.now()-T.end>20000)stopRest();
  }
}
$('#tplus').onclick=()=>{T.end+=15000;tick()};
$('#tstop').onclick=stopRest;
// dopo una serie: l'altro esercizio della coppia, poi lo stesso, poi il primo ancora da finire
function nextUp(w,S,id){
  const grp=SESS[S].groups.find(x=>Array.isArray(x)&&x.includes(id));
  const open=x=>{const n=pxOf(w,x).sets;for(let i=1;i<=n;i++)if(!store[sk(w,S,x,i)+'.ok'])return i;return 0};
  const lab=x=>`${EX[x].sh} · serie ${open(x)}`;
  const other=grp.find(x=>x!==id);
  if(other&&open(other))return lab(other);
  if(open(id))return lab(id);
  const o=idsOf(S).find(x=>open(x));
  return o?lab(o):null;
}
function refreshProgress(w,S){
  const p=progress(w,S),id=`${w}|${S}`;
  document.querySelectorAll(`[data-prog="${id}"]`).forEach(el=>el.textContent=`${p.done} di ${p.tot} serie`);
  document.querySelectorAll(`[data-bar="${id}"]`).forEach(el=>el.style.width=(p.tot?p.done/p.tot*100:0)+'%');
  return p;
}
function exportDiary(){
  store.lastExport=new Date().toISOString();save();
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(store,null,1)],{type:'application/json'}));
  a.download='diario-scheda-'+isoOf(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();
  toast('Diario esportato');render(true);
}
function setField(k,v){store[k]=v;const f=document.querySelector(`input[data-k="${k}"]`);if(f)f.value=v}

// ---------- eventi ----------
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-tab],[data-w],[data-day],[data-back],[data-ok],[data-rir],[data-qr],[data-done],[data-calc],[data-exp]');
  if(!el)return;
  const ds=el.dataset;
  if(ds.tab){go(ds.tab);return}
  if(ds.w!==undefined){S.w=+ds.w;render(false);return}
  if(ds.day){const [w,d]=ds.day.split('|').map(Number);S.tab='sett';S.w=w;S.day=[w,d];render(false);return}
  if(ds.back!==undefined){S.day=null;render(false);return}
  if(ds.exp!==undefined){exportDiary();return}
  if(ds.calc!==undefined){const v=$('#t5k').value;if(setVdotFrom(v)){render(true);toast(`Ritmi aggiornati · VDOT ${num(store.vdot.toFixed(1))}`)}else toast('Scrivi il tempo come 26:30');return}
  if(ds.rir){const [w,Sx,id,v]=ds.rir.split('|'),k=ek(+w,Sx,id)+'.rir';if(store[k]===v)delete store[k];else store[k]=v;save();render(true);return}
  if(ds.qr){const [w,v]=ds.qr.split('|'),k=`w${+w+1}.q.reps`;if(store[k]===v)delete store[k];else store[k]=v;snapRun(+w,'q');save();render(true);return}
  if(ds.done){const [ws,k]=ds.done.split('|'),w=+ws,key=doneKey(w,k);
    if(store[key])delete store[key];else{store[key]=new Date().toISOString();if(!SESS[k])snapRun(w,k);toast('Seduta fatta')}
    save();render(true);return}
  if(ds.ok){
    const [ws,Sx,id,is]=ds.ok.split('|'),w=+ws,i=+is,b=sk(w,Sx,id,i),e=EX[id],on=!store[b+'.ok'];
    if(on){
      const px=pxOf(w,id),eb=ek(w,Sx,id);
      store[b+'.ok']=1;
      // spunta senza scrivere = obiettivo fatto; il peso è quello della serie prima o quello proposto
      if(String(store[b+'.r']??'').trim()==='')setField(b+'.r',String(px.reps[i-1]??px.reps[px.reps.length-1]));
      if(hasKg(e)&&kgOf(store[b+'.kg'])===null){const pk=i>1?kgOf(store[sk(w,Sx,id,i-1)+'.kg']):null;setField(b+'.kg',num(pk??px.kg))}
      if(store[eb+'.lv']==null)store[eb+'.lv']=String(px.lv);
      if(px.kind==='deload')store[eb+'.dl']=1;
    }else delete store[b+'.ok'];
    el.classList.toggle('on',on);
    const art=el.closest('.ex');if(art){const n=pxOf(w,id).sets;let a=true;for(let j=1;j<=n;j++)if(!store[sk(w,Sx,id,j)+'.ok'])a=false;art.classList.toggle('complete',a)}
    const p=refreshProgress(w,Sx);
    if(on){unlockAudio();keepAwake();
      if(p.done===p.tot){stopRest();if(!isDone(w,Sx))store[doneKey(w,Sx)]=new Date().toISOString();save();toast('Seduta completata');render(true);return}
      save();startRest(e.rest,nextUp(w,Sx,id));
    }else save();
  }
});
document.addEventListener('click',ev=>{const s=ev.target.closest('details.note summary');if(s&&s.parentElement.nextElementSibling&&s.parentElement.nextElementSibling.hasAttribute('data-anyway')){s.parentElement.nextElementSibling.hidden=false;s.parentElement.remove()}});
document.addEventListener('input',ev=>{const i=ev.target,k=i.dataset&&i.dataset.k;if(!k)return;
  if(i.value==='')delete store[k];else store[k]=i.value;
  const m=k.match(/^w(\d+)\.(q|l)\./);if(m)snapRun(+m[1]-1,m[2]);
  save()});
document.addEventListener('change',ev=>{
  const i=ev.target,ds=i.dataset||{};
  if(ds.k&&/\.q\.t5k$/.test(ds.k)){if(setVdotFrom(i.value)){toast(`Ritmi aggiornati dal test · VDOT ${num(store.vdot.toFixed(1))}`);render(true)}return}
  if(ds.k&&/\.r$|\.kg$/.test(ds.k)&&S.tab!=='prog'){const m=ds.k.match(/^w(\d+)\.([ABC])\./);if(m&&isDone(+m[1]-1,m[2]))render(true);return}
  if(ds.ready!==undefined){store['ready.'+ds.ready]=i.value.trim();save();render(true);return}
  if(ds.sick!==undefined){if(i.checked)store['sick.'+ds.sick]=1;else delete store['sick.'+ds.sick];save();render(true);return}
  if(ds.imp!==undefined){const f=i.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o||typeof o!=='object')throw 0;store=o;save();render(true);toast('Diario importato')}catch(x){toast('File non valido')}})}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&renderedDay!==isoOf(new Date())&&S.tab==='oggi')render(false)});

// all'apertura: sempre la seduta di oggi
S.w=Math.max(0,oggi().w);
render(false);
</script>
</body>
</html>
